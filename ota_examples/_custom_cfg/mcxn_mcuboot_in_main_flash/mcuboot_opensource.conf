CONFIG_MCUX_COMPONENT_middleware.mcuboot.mcxn_custom_cfg.main_flash_only=y
CONFIG_MCUX_COMPONENT_middleware.mbedtls3x=y
CONFIG_MCUX_COMPONENT_middleware.mbedtls3x.port.config=n
CONFIG_MCUX_COMPONENT_middleware.mbedtls3x.port.only_accelerator_config=y
CONFIG_MCUX_COMPONENT_middleware.mbedtls3x.port.psa_crypto_config=n
CONFIG_MCUX_COMPONENT_component.els_pkc=y
CONFIG_MCUX_COMPONENT_component.psa_crypto_driver.els_pkc=y
CONFIG_MCUX_COMPONENT_middleware.mcuboot.nxp_encrypted_xip=y