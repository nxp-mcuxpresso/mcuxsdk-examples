# Custom configuration for encrypted XIP evaluation
# boards: frdmrw612, rdrw612bga

CONFIG_MCUX_COMPONENT_middleware.mcuboot.serial_recovery=n
CONFIG_MCUX_COMPONENT_component.psa_crypto_driver.els_pkc=n
CONFIG_BOOT_CUSTOM_DEVICE_SETUP=y
CONFIG_BOOT_MODE_ENCRYPTED_XIP_OVERWRITE=y
CONFIG_BOOT_FLASH_ACT_APP_ADDRESS=0x08040000
CONFIG_BOOT_FLASH_CAND_APP_ADDRESS=0x08240000
CONFIG_BOOT_FLASH_SLOT0_ENC_CFG_ADDRESS=0x08440000
CONFIG_BOOT_FLASH_SLOT1_ENC_CFG_ADDRESS=0x08441000