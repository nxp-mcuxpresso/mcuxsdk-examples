    - -armgcc@release
    - -armgcc@sdram_debug
    - -armgcc@sdram_release
    - -iar@debug
    - -iar@release
    - -iar@sdram_debug
    - -iar@sdram_release
    - -mdk@debug
    - -mdk@release
    - -mdk@sdram_debug
    - -mdk@sdram_release
    - -mdk@flexspi_nor_debug
    - -mdk@flexspi_nor_release
    evkcmimxrt1060:
    - -armgcc@debug
    - -armgcc@release
    - -armgcc@sdram_debug
    - -armgcc@sdram_release
    - -iar@debug
    - -iar@release
    - -iar@sdram_debug
    - -iar@sdram_release
    - -mdk@debug
    - -mdk@release
    - -mdk@sdram_debug
    - -mdk@sdram_release
    - -mdk@flexspi_nor_debug
    - -mdk@flexspi_nor_release
    frdmmcxn947@cm33_core0:
    - -mdk@debug
    - -mdk@release
    frdmmcxn947t@cm33_core0:
    - -mdk@debug
    - -mdk@release
    mcxn5xxevk@cm33_core0:
    - -mdk@debug
    - -mdk@release
    mcxn9xxevk@cm33_core0:
    - -mdk@debug
    - -mdk@release
