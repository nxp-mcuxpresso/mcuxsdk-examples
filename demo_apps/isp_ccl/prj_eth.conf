# This is project override file for isp_ccl demo to enable ethernet PHY and TCP stack
# For isp_ccl demo you can simply add -DISPSDK_ENABLE_ETH=1 to west build command to merge this file to project

CONFIG_MCUX_COMPONENT_middleware.ispsdk.eth=y

CONFIG_MCUX_COMPONENT_component.rgpio_adapter=y
CONFIG_MCUX_COMPONENT_middleware.lwip.netc_ethernetif=y
CONFIG_MCUX_COMPONENT_component.phyaqr113c=y
CONFIG_MCUX_COMPONENT_component.phyrtl8211f=y
CONFIG_MCUX_COMPONENT_component.phytja1104=y
CONFIG_MCUX_COMPONENT_driver.msgintr=y
CONFIG_MCUX_COMPONENT_driver.pcal6408=y
CONFIG_MCUX_COMPONENT_driver.pcal6524=y
CONFIG_MCUX_COMPONENT_driver.pca6416a=y
CONFIG_MCUX_ABSTRACT_COMPONENT_component_expander=y
CONFIG_MCUX_COMPONENT_component.silicon_id=n
CONFIG_NETC_PORT_USE_INCLUDES=y

# lwIP configuration:
CONFIG_MCUX_COMPONENT_middleware.lwip=y
CONFIG_MCUX_COMPONENT_middleware.lwip.contrib.tcpecho=y
CONFIG_MCUX_PRJSEG_middleware.lwip.generated_config=y
CONFIG_LWIP_OPT_H_CODE_LINE_1="void sys_lock_tcpip_core(void);"
CONFIG_LWIP_OPT_H_CODE_LINE_2="void sys_unlock_tcpip_core(void);"
CONFIG_LWIP_OPT_H_CODE_LINE_3="void sys_check_core_locking(void);"
CONFIG_LWIP_OPT_H_CODE_LINE_4="void sys_mark_tcpip_thread(void);"
CONFIG_LWIP_IPV6=n
CONFIG_LWIP_IPV6_AUTOCONFIG=n
CONFIG_SYS_LIGHTWEIGHT_PROT=y
CONFIG_NO_SYS=n
CONFIG_LWIP_NETCONN=y
CONFIG_LWIP_SOCKET=y
CONFIG_LWIP_SO_RCVTIMEO=y
CONFIG_LWIP_TCPIP_CORE_LOCKING=y
CONFIG_LOCK_TCPIP_CORE_CUSTOM( )="sys_lock_tcpip_core()"
CONFIG_UNLOCK_TCPIP_CORE_CUSTOM( )="sys_unlock_tcpip_core()"
CONFIG_LWIP_ASSERT_CORE_LOCKED( )="sys_check_core_locking()"
CONFIG_LWIP_MARK_TCPIP_THREAD( )="sys_mark_tcpip_thread()"
CONFIG_MEM_ALIGNMENT=4
CONFIG_MEM_SIZE=22528
CONFIG_MEMP_NUM_PBUF=15
CONFIG_MEMP_NUM_UDP_PCB=6
CONFIG_MEMP_NUM_TCP_PCB=10
CONFIG_MEMP_NUM_TCP_PCB_LISTEN=6
CONFIG_MEMP_NUM_TCP_SEG=22
CONFIG_MEMP_NUM_SYS_TIMEOUT="10"
CONFIG_MEMP_NUM_REASSDATA=4
CONFIG_PBUF_POOL_SIZE=5
CONFIG_LWIP_TCP=y
CONFIG_TCP_TTL=255
CONFIG_TCP_QUEUE_OOSEQ=n
CONFIG_TCP_MSS=1460
CONFIG_TCP_SND_BUF="(6 * TCP_MSS)"
CONFIG_TCP_SND_QUEUELEN="((3 * TCP_SND_BUF) / TCP_MSS)"
CONFIG_TCP_WND="(2 * TCP_MSS)"
CONFIG_TCP_LISTEN_BACKLOG=y
CONFIG_LWIP_NETIF_API=y
CONFIG_LWIP_ICMP=n
CONFIG_LWIP_DHCP=n
CONFIG_LWIP_UDP=n
CONFIG_UDP_TTL=255
CONFIG_LWIP_STATS=n
CONFIG_LWIP_PROVIDE_ERRNO=y
CONFIG_DEFAULT_THREAD_STACKSIZE=3000
CONFIG_DEFAULT_THREAD_PRIO=3
CONFIG_LWIP_DEBUG=y
CONFIG_TCPIP_MBOX_SIZE=32
CONFIG_TCPIP_THREAD_STACKSIZE=1024
CONFIG_TCPIP_THREAD_PRIO=3
CONFIG_DEFAULT_RAW_RECVMBOX_SIZE=12
CONFIG_DEFAULT_UDP_RECVMBOX_SIZE=12
CONFIG_DEFAULT_TCP_RECVMBOX_SIZE=12
CONFIG_DEFAULT_ACCEPTMBOX_SIZE=12
CONFIG_LWIP_NETIF_EXT_STATUS_CALLBACK=y
CONFIG_IP_REASS_MAX_PBUFS=4
CONFIG_LWIP_SINGLE_NETIF=y

# FreeRTOS configuration:
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.heap_3=y
# for heap3 (gcc's malloc) the heap is allocated via linker file
CONFIG_configTOTAL_HEAP_SIZE=0
CONFIG_configAPPLICATION_ALLOCATED_HEAP=n
