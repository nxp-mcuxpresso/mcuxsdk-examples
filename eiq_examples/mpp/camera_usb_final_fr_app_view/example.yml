camera_usb_final_fr_app_view:
  section-type: application
  contents:
    meta_path: examples/eiq_examples/mpp/camera_usb_final_fr_app_view
    project-root-path: boards/${board}/eiq_examples/mpp/camera_usb_final_fr_app_view
    document:
      name: camera_usb_final_fr_app_view
      category: eiq_examples
      brief: Vision Pipeline example for USB camera with face recognition
      example_readme:
      - examples/eiq_examples/mpp/camera_usb_final_fr_app_view/readme.md
      - middleware/eiq/mpp/${board}/board_readme.md
    configuration:
      tools:
        __common__:
          config:
            __common__:
              cc-define:
                HAL_LOG_LEVEL: 0 
              cx-define:
                HAL_LOG_LEVEL: 0 
  boards:
    mimxrt700evk@cm33_core0:
    - -armgcc@debug
    - -armgcc@release
    - -iar@debug
    - -iar@release
    - -mdk@debug
    - -mdk@release
    - +armgcc@flash_debug
    - +armgcc@flash_release
    - -iar@flash_debug
    - -iar@flash_release
    - -mdk@flash_debug
    - -mdk@flash_release
