CONFIG_MCUX_PRJSEG_module.board.pinmux_board_folder=y
CONFIG_MCUX_PRJSEG_project.hw_app_customize_folder=y
CONFIG_LV_ATTRIBUTE_MEM_ALIGN_SIZE=64
# The benchmark uses LVGL's builtin allocator and warns (-> -Werror) below 128kB.
CONFIG_LV_MEM_SIZE_KILOBYTES=384
CONFIG_LV_MEM_POOL_EXPAND_SIZE_KILOBYTES=4096
# Lower the display frame rate for LVGL to ease DCIF/PSRAM scan-out bandwidth.
CONFIG_DEMO_FRAME_RATE=20
