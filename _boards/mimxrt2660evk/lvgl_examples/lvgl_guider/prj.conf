CONFIG_MCUX_PRJSEG_module.board.pinmux_board_folder=y
CONFIG_MCUX_PRJSEG_project.hw_app_customize_folder=y
CONFIG_LV_ATTRIBUTE_MEM_ALIGN_SIZE=64
# Lower the display frame rate for LVGL to ease DCIF/PSRAM scan-out bandwidth.
CONFIG_DEMO_FRAME_RATE=20
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.cm85_non_trustzone=y
# LVGL drives its time base from vApplicationTickHook() -> lv_tick_inc(), so the
# FreeRTOS tick hook must be enabled or LVGL never renders (blank panel). 1kHz
# tick keeps lv_tick_inc(1)/tick == 1ms so LVGL timing is accurate.
CONFIG_configUSE_TICK_HOOK=y
CONFIG_configTICK_RATE_HZ=1000
# FreeRTOS heap must hold the LVGL task stack (8KB) + idle/timer tasks + LVGL's
# LV_OS_FREERTOS mutexes. The default 10KB is far too small (LVGL objects fail
# to allocate -> blank panel). Match the reference sizing and surface failures.
CONFIG_configTOTAL_HEAP_SIZE=102400
CONFIG_configUSE_MALLOC_FAILED_HOOK=y
