# ---------------------------------------------------------------------------
# Phase 1: UART-only modelrunner (NPU + PSRAM)
# Phase 2: HTTP mode -- append the network components listed at the bottom.
# ---------------------------------------------------------------------------

# Shared utility components
CONFIG_MCUX_COMPONENT_component.lists=y
CONFIG_MCUX_COMPONENT_component.lpuart_adapter=y
CONFIG_MCUX_COMPONENT_driver.lpflexcomm_lpuart=y
CONFIG_MCUX_COMPONENT_driver.port=y
CONFIG_MCUX_COMPONENT_driver.xspi=y
CONFIG_MCUX_COMPONENT_component.gpio_adapter=y

# TFLite Micro + Neutron NPU inference engine
CONFIG_MCUX_COMPONENT_middleware.eiq.tensorflow_lite_micro.binary=y
CONFIG_MCUX_COMPONENT_middleware.eiq.tensorflow_lite_micro.neutron=y

# ---------------------------------------------------------------------------
# Phase 2 additions (HTTP mode).
# These components are required when CONFIG_MODELRUNNER_HTTP=y.
# Uncomment all lines in this block when building with MODELRUNNER_HTTP=1.
# ---------------------------------------------------------------------------
# ENET (gigabit, COMM__ENET path)
#CONFIG_MCUX_COMPONENT_driver.enet=y
# YT8521/YT8531 PHY driver (register-compatible on this board)
#CONFIG_MCUX_COMPONENT_component.phyyt8521=y
# lwIP ENET ethernetif + core stack
#CONFIG_MCUX_COMPONENT_middleware.lwip.kinetis_ethernetif=y
#CONFIG_MCUX_COMPONENT_middleware.lwip.core=y
#CONFIG_LWIP_ENET_FLEXIBLE_CONFIGURATION=y
# FreeRTOS kernel for CM85 without TrustZone
#CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.cm85_non_trustzone=y
#CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.heap_3=y
#CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.extension=y
# I2C master driver + PCAL6524 I2C IO expander (PHY reset via ETH1_RST_B)
#CONFIG_MCUX_COMPONENT_driver.lpi2c=y
#CONFIG_MCUX_COMPONENT_component.pcal6524=y
