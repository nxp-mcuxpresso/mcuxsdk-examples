# LittleFS partition on W25H512NWEAM (512 Mb / 64 MB, quad NOR, MAIN__XSPI_0).
#
# The binary image is stored at the beginning of flash; the LittleFS partition
# starts at 4 MB (0x400000) to leave room for the XIP image.  Sector size is
# 4 KB (matched to the flash erase granularity).  2048 sectors gives an 8 MB
# LittleFS partition, consistent with the evkmimxrt1180 reference configuration.
CONFIG_LITTLEFS_START_ADDR=0x400000

# W25H512NWEAM erase granularity: 4 KB sector
CONFIG_LITTLEFS_BLOCK_SIZE=4096
CONFIG_LITTLEFS_BLOCK_COUNT=2048
