# Components
CONFIG_MCUX_COMPONENT_component.lpi2c_adapter=y

# Drivers - RT2660 uses edma4 driver for AUDIO__EDMA3 (not RT10xx edma+dmamux)
CONFIG_MCUX_COMPONENT_driver.edma4=y
CONFIG_MCUX_COMPONENT_driver.lpi2c=y
CONFIG_MCUX_COMPONENT_driver.sai=y
CONFIG_MCUX_COMPONENT_driver.sai_edma=y
CONFIG_MCUX_COMPONENT_driver.wm8962=y

# FreeRTOS port for RT2660 Cortex-M85 (non-TrustZone)
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.cm85_non_trustzone=y

# Maestro configuration
CONFIG_MCUX_PRJSEG_module.audio_voice.default_config=y
