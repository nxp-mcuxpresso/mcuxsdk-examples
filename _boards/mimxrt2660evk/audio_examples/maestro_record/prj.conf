# Components
CONFIG_MCUX_COMPONENT_component.lpi2c_adapter=y

# GPIO / IO expander drivers referenced unconditionally by mimxrt2660evk sdmmc_config.c
CONFIG_MCUX_ABSTRACT_COMPONENT_component_expander=y
CONFIG_MCUX_COMPONENT_driver.pcal6524=y
CONFIG_MCUX_COMPONENT_driver.pca9555=y

# Drivers - RT2660 uses edma4 driver for AUDIO__EDMA3 (not the RT10xx edma+dmamux)
CONFIG_MCUX_COMPONENT_driver.edma4=y
CONFIG_MCUX_COMPONENT_driver.lpi2c=y
CONFIG_MCUX_COMPONENT_driver.pdm_edma=y
CONFIG_MCUX_COMPONENT_driver.sai=y
CONFIG_MCUX_COMPONENT_driver.sai_edma=y
CONFIG_MCUX_COMPONENT_driver.wm8962=y
# Last-level cache driver: the streamer TX buffers live in the PSRAM FreeRTOS
# heap behind the LLC, which the SAI TX EDMA master bypasses; streamer_pcm_write
# writes the LLC back so the DMA never replays stale PSRAM.
CONFIG_MCUX_COMPONENT_driver.cache_llc=y

# SDMMC configuration
CONFIG_MCUX_COMPONENT_middleware.sdmmc.host.usdhc=y
CONFIG_MCUX_COMPONENT_middleware.sdmmc.host.usdhc.non_blocking=y
CONFIG_MCUX_COMPONENT_middleware.sdmmc.sd=y

# FreeRTOS port for RT2660 Cortex-M85 (non-TrustZone)
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.cm85_non_trustzone=y

# Maestro configuration
CONFIG_MCUX_PRJSEG_module.audio_voice.default_config=y
# CMSIS_DSP_Source intentionally NOT enabled here: it's only needed by ASRC
# (not used by maestro_record) and its Helium/MVE code path currently fails to
# build with arm-none-eabi-gcc for Cortex-M85. Enable only if ASRC is added.

# Explicitly enable maestro decoders. The shared example prj.conf already sets
# these but we re-assert them so components.cmake defines
# -DMP3_DEC / -DWAV_DEC / -DFLAC_DEC / -DAAC_DEC / -DOGG_OPUS_DEC macros
# required by main.c/cmd.c preprocessor guards.
CONFIG_MCUX_COMPONENT_middleware.audio_voice.maestro.element.decoder.enable=y
CONFIG_MCUX_COMPONENT_middleware.audio_voice.maestro.element.decoder.mp3.enable=y
CONFIG_MCUX_COMPONENT_middleware.audio_voice.maestro.element.decoder.wav.enable=y
CONFIG_MCUX_COMPONENT_middleware.audio_voice.maestro.element.decoder.flac.enable=y
CONFIG_MCUX_COMPONENT_middleware.audio_voice.maestro.element.decoder.aac.enable=y
CONFIG_MCUX_COMPONENT_middleware.audio_voice.maestro.element.decoder.opus_ogg.enable=y

# Project configuration
CONFIG_MAESTRO_ELEMENT_PROCESS_SINK_VIT_ENABLE=n
CONFIG_MAESTRO_EXAMPLE_VIT_MODEL_ALL_ENABLE=n
