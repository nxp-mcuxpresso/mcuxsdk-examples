# Power mode switch example for MIMXRT2662EVK
# Enables: unified power driver (auto-selects pdcon/memcon/powercon/vbatcon/rt2k_pmu),
#          GPIO for user button, LPUART for debug console.
CONFIG_MCUX_COMPONENT_driver.power=y
CONFIG_MCUX_COMPONENT_driver.rt2k_pmu=y
CONFIG_MCUX_COMPONENT_driver.gpio=y
CONFIG_MCUX_COMPONENT_driver.lpuart=y
CONFIG_MCUX_COMPONENT_driver.lptmr=y
CONFIG_MCUX_COMPONENT_driver.irtc=y
CONFIG_MCUX_COMPONENT_driver.edma4=y
