# power_manager_test for MIMXRT2660EVK
# Enables: power_manager framework, unified power driver (auto-selects
#          pdcon/memcon/powercon/vbatcon/rt2k_pmu), VBAT LPTMR (low-power timer).
CONFIG_MCUX_COMPONENT_component.power_manager_framework=y
CONFIG_MCUX_COMPONENT_driver.power=y
CONFIG_MCUX_COMPONENT_driver.lptmr=y
