CONFIG_MCUX_COMPONENT_driver.cache_llc=y
CONFIG_MCUX_COMPONENT_driver.xspi=y

# The LLC driver initializes its 2D physical-memory alias tables from the
# single-braced device macros LLC_PHYMEM_BASES / LLC_PHYMEM_SIZES, which trips
# armgcc -Werror=missing-braces. This is a pre-existing driver/device-header
# issue (not specific to this example); suppress warnings-as-errors here, as
# the existing LLC unit-test projects do, so the supported armgcc toolchain
# builds cleanly.
CONFIG_MCUX_PRJSEG_config.arm.suppress.warn_as_error=y
