# Board-specific components for the mimxrt2660evk xspi_quad_edma_transfer example.
# The board flash ops flush the shared last-level cache (LLC) before AHB
# read-back of the XSPI0 NOR window, so pull in the LLC cache driver (fsl_llc).
CONFIG_MCUX_COMPONENT_driver.cache_llc=y
# XSPI0 TX/RX requests are serviced by MAIN__EDMA5 through the edma4 driver.
CONFIG_MCUX_COMPONENT_driver.edma4=y
