#select profile
CONFIG_MCUX_COMPONENT_middleware.tfm.profile_small=y

#include pin_mux board component
CONFIG_MCUX_PRJSEG_module.board.pinmux_board_core_folder=y

#drivers
CONFIG_MCUX_COMPONENT_middleware.tfm.lpuart=y
CONFIG_MCUX_COMPONENT_driver.ctimer=y

# enable west flash of tfm example
CONFIG_FLASH_BASE_ADDRESS=0x00026000

# tfm regression tests IPC and protected storage not available with profile small by default 
CONFIG_MCUX_COMPONENT_middleware.tfm.ns.test.ipc=n
CONFIG_MCUX_COMPONENT_middleware.tfm.ns.test.ps=n
