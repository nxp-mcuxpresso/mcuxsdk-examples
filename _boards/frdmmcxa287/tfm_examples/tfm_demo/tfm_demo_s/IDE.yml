flash_programming_file:
  files:
  - source: ${board_root}/${board}/tfm_examples/tfm_demo/tfm_demo_s/tfm_demo_flashdownload.ini
    attribute: flash_programming_file
    toolchains: mdk
    targets: debug release
initialization_file:
  files:
  - source: ${board_root}/${board}/tfm_examples/tfm_demo/tfm_demo_s/tfm_demo_flashdebug.ini
    attribute: initialization_file
    toolchains: mdk
    targets: debug release
mdk:
  shared-workspace: tfm_demo
  sharing-workspace:
  - ../../tfm_demo_ns/mdk/tfm_demo_ns
  - ../../tfm_s_crypto_clients/mdk/tfm_s_crypto_clients
iar:
  shared-workspace: tfm_demo
  sharing-workspace:
  - ../../tfm_demo_ns/iar/tfm_demo_ns
  - ../../tfm_s_crypto_clients/iar/tfm_s_crypto_clients
  config:
    __common__:
      download-extra-image:
      - path: "../../tfm_demo_ns/iar/tfm_demo_ns.out"
        item: 1
        offset: 0
        debug_info_only: false
