# PSA crypto driver for MCXA266
CONFIG_MCUX_COMPONENT_component.psa_crypto_driver.sgi=y
CONFIG_MCUX_COMPONENT_component.psa_crypto_driver.pkc=y
CONFIG_MCUX_COMPONENT_component.sgi_pkc=y

# MBEDTLS confiuration
CONFIG_MCUX_COMPONENT_middleware.mbedtls=y
CONFIG_MCUX_COMPONENT_middleware.mbedtls.default_config=y
CONFIG_MCUX_COMPONENT_middleware.mbedtls.tf_psa_crypto=y
CONFIG_MCUX_COMPONENT_middleware.mbedtls.tf_psa_crypto.builtin_driver=y
CONFIG_MCUX_COMPONENT_middleware.mbedtls.tf_psa_crypto.default_config=y

CONFIG_MCUX_PRJSEG_project.hw_app_project_folder=y
CONFIG_MCUX_PRJSEG_module.board.pinmux_board_folder=y

# Enable ROM API flash driver for MCXA266 
CONFIG_MCUX_COMPONENT_driver.romapi=y

# enable configs for usage platform specific flash drivers to be used with file system
CONFIG_MCUX_COMPONENT_component.mflash_onchip=y

CONFIG_LITTLEFS_START_ADDR=0x66000
CONFIG_LITTLEFS_READ_SIZE=8
CONFIG_LITTLEFS_BLOCK_SIZE=8192
CONFIG_LITTLEFS_BLOCK_COUNT=10
CONFIG_LITTLEFS_PROG_SIZE=128
CONFIG_LITTLEFS_BLOCK_CYCLES=500
CONFIG_LITTLEFS_CACHE_SIZE=256
CONFIG_LITTLEFS_LOOKAHEAD_SIZE=16
