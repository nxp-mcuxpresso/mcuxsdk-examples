CONFIG_MCUX_PRJSEG_project.hw_app_project_core_folder=y

# Shared RPMsg vring/buffer region at 0x20400000 is mapped cacheable write-back
# (board.c MPU region 7) with D-cache enabled on both M7 cores. Enable RPMsg
# cache maintenance so vring updates are coherent between the two cores.
CONFIG_RL_USE_DCACHE=y
