# Board-specific IDE.yml override for frdmmcxe32b.
# Fixes secondary-project path: shared template uses ${SB_CONFIG_secondary_core_id}
# which resolves to "core1", but the real suffix is "_cm7_core1" on MCXE32B.

iar:
  shared-workspace: freertos_message_buffers
  sharing-workspace:
  - ../../freertos_message_buffers_secondary_core/iar/freertos_message_buffers_secondary_core_cm7_core1
  config:
    __common__:
      asym-multicore-debugger:
        enable: true
        slave-workspace: "../../freertos_message_buffers_secondary_core/iar/freertos_message_buffers_secondary_core_cm7_core1.eww"
        slave-project: freertos_message_buffers_secondary_core_cm7_core1
        attach-partner: true

mdk:
  shared-workspace: freertos_message_buffers
  sharing-workspace:
  - ../../freertos_message_buffers_secondary_core/mdk/freertos_message_buffers_secondary_core_cm7_core1
