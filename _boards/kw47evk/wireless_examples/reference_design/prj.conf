# Allow fault detection on NBU
# NBU shall be using framework fault handlers module for this to be true
CONFIG_MCUX_PRJSEG_module.board.wireless.board.debug_nbu=y
# NBU debug module (HCI logging to be precise) requires additional WQ stack
CONFIG_FWK_SYSWORKQ_STACK_SIZE=700

# Stream the main-core Zephyr coredump as framed Base64 over the application console.
# DEBUG_COREDUMP_BACKEND_OTHER is a Kconfig choice value, so it cannot be turned on
# with select from the prjseg; it must be chosen here in the project config.
CONFIG_MCUX_PRJSEG_module.board.wireless.board.debug_coredump=y
CONFIG_DEBUG_COREDUMP_BACKEND_OTHER=y
CONFIG_MCMGR_REMOTE_APP_EVENT_COUNT=2
