 *
 * RAM-only debug setup for the MIMXRT700-EVK cm33_core0 XSPI0 quad (W25Q512)
 * examples (driver_examples/xspi/quad/polling_transfer and edma_transfer).
 *
 * The image links entirely into internal SRAM with its vector table at
 * 0x00080000 (no XIP). After the debugger issues SYSRESETREQ the Cortex-M33
 * boots the ROM (VTOR=0), NOT our RAM image, so on every reset we re-point
 * VTOR/SP/PC back to the RAM vector table. SRAM contents survive the reset.
 */

FUNC void Setup_PC_SP (void) {
    SP = _RDWORD(0x00080000);          // initial MSP   = vector[0]
    PC = _RDWORD(0x00080004);          // Reset_Handler = vector[1]
    _WDWORD(0xE000ED08, 0x00080000);   // SCB->VTOR -> RAM vector table
}

FUNC void OnResetExec (void) {         // called by uVision after every reset
    Setup_PC_SP();
}

LOAD %L INCREMENTAL                    // (re)load the RAM image (%L = this project's .out)
Setup_PC_SP();                         // aim the core at the RAM image after load
