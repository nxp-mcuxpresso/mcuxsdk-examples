# Enable HCI transport
CONFIG_MCUX_COMPONENT_middleware.wireless.ble_hci_transport_rpmsg=y

# Use SW implementation of seclib
CONFIG_MCUX_COMPONENT_middleware.wireless.framework.seclib_rng_port.sw=y

# Disable unneeded components
CONFIG_MCUX_COMPONENT_middleware.wireless.framework.lowpower=n # No need for low power in this app
CONFIG_MCUX_COMPONENT_middleware.wireless.framework.platform.lowpower=n
CONFIG_MCUX_PRJSEG_module.board.wireless.board.lowpower=n
CONFIG_MCUX_COMPONENT_component.power_manager_framework=n

CONFIG_MCUX_COMPONENT_middleware.wireless.framework.hw_parameter=n # Already part of MCXW23 ROM API (FFR_GetBdAddress)
CONFIG_MCUX_COMPONENT_middleware.wireless.controller_api=n # CONFIG_MCUX_COMPONENT_middleware.wireless.snps_ll_controller_api used instead
CONFIG_MCUX_COMPONENT_middleware.wireless.framework.platform.reset=n # Already implemented in MCXW23 Power library (POWER_Reset)

CONFIG_MCUX_COMPONENT_utility.assert=n # Automatically selects debug_console but we want debug_console_lite
CONFIG_MCUX_COMPONENT_utility.debug_console=n

# Fixes
CONFIG_MCUX_MISC_middleware.freertos-kernel.heap_custom=y
CONFIG_MCUX_COMPONENT_middleware.wireless.framework.ota_support=y
CONFIG_MCUX_COMPONENT_middleware.wireless.framework.ota_support.internal_flash=y