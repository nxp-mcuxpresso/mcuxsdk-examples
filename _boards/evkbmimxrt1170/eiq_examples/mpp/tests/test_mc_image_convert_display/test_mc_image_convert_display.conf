### List of the configurations supported by the application
# APP_CONFIGS_START
# Graphics CPU: Image scaling to display dimensions (pixel format is RGB565)
APP_CONFIG1: -DAPP_CONFIG=1 -DIMG_CONVERT_CPU=1 -DIMAGE_TYPE=0 -DIMG_FULL_SCREEN=1
# Graphics PXP: Color convert GRAY to RGB565
APP_CONFIG2: -DAPP_CONFIG=2 -DIMAGE_TYPE=7
# Graphics CPU: Color convert GRAY to RGB565
APP_CONFIG3: -DAPP_CONFIG=3 -DIMG_CONVERT_CPU=1 -DIMAGE_TYPE=7
# Graphics CPU: Color convert GRAY to RGB565 + fullscreen
APP_CONFIG4: -DAPP_CONFIG=4 -DIMG_CONVERT_CPU=1 -DIMAGE_TYPE=7 -DIMG_FULL_SCREEN=1
# Graphics CPU: Color convert GRAY to RGB565 + fullscreen + Rotate 90°
APP_CONFIG5: -DAPP_CONFIG=5 -DIMG_CONVERT_CPU=1 -DIMAGE_TYPE=7 -DIMG_FULL_SCREEN=1 -DIMG_ROTATE=1
# Graphics CPU: Color convert GRAY to RGB565 + fullscreen + Rotate 180°
APP_CONFIG6: -DAPP_CONFIG=6 -DIMG_CONVERT_CPU=1 -DIMAGE_TYPE=7 -DIMG_FULL_SCREEN=1 -DIMG_ROTATE=2
# Graphics CPU: Color convert GRAY to RGB565 + fullscreen + Rotate 270°
APP_CONFIG7: -DAPP_CONFIG=7 -DIMG_CONVERT_CPU=1 -DIMAGE_TYPE=7 -DIMG_FULL_SCREEN=1 -DIMG_ROTATE=3
# APP_CONFIGS_END
