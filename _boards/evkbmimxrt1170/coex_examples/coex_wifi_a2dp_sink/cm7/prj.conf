# Component - Wi-Fi + BT module
CONFIG_MCUX_COMPONENT_component.wifi_bt_module.IW61X=y
CONFIG_MCUX_COMPONENT_component.wifi_bt_module.board_murata_2el_m2=y
CONFIG_MCUX_COMPONENT_component.wifi_bt_module.wifi_fw=y
CONFIG_MCUX_COMPONENT_component.wifi_bt_module.bt_only_fw=y
CONFIG_MCUX_COMPONENT_component.psa_crypto_driver.caam=y
CONFIG_MCUX_COMPONENT_component.common_task=y

# Component - Wi-Fi
CONFIG_MCUX_DEPENDENCY_COMPONENT_middleware.wifi.template_DEPEND_ANYOF_OPTION_2=y
CONFIG_MCUX_COMPONENT_middleware.wifi.sdio=y
CONFIG_MCUX_COMPONENT_middleware.wifi.net_free_rtos=y
CONFIG_MCUX_COMPONENT_middleware.sdmmc.host.usdhc=y
CONFIG_MCUX_COMPONENT_middleware.sdmmc.host.usdhc.non_blocking=y
CONFIG_MCUX_COMPONENT_middleware.sdmmc.sdio=y
CONFIG_MCUX_COMPONENT_middleware.mbedtls3x.port.config=y

# Component - edgefast_open
CONFIG_MCUX_COMPONENT_middleware.edgefast_open=y

# Component - A2DP audio playback: WM8962 codec + SAI EDMA audio adapter
CONFIG_MCUX_COMPONENT_driver.wm8962=y
CONFIG_MCUX_COMPONENT_component.audio_sai_edma_adapter=y

# Component - timer manager
CONFIG_MCUX_DEPENDENCY_COMPONENT_component.timer_manager_DEPEND_component.timer_manager_pit=y

# Firmware download
CONFIG_BT_BYPASS_DOWNLOAD=y

# BT config
CONFIG_BT_A2DP=y
CONFIG_BT_A2DP_SINK=y
CONFIG_BT_CLASSIC=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="a2dp_sink"
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_SMP=y
CONFIG_BT_COD=0x200404
CONFIG_BT_BUF_ACL_RX_SIZE=1300
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=y
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_PHY_UPDATE=y

# FreeRTOS
CONFIG_MCUX_PRJSEG_middleware.freertos-kernel.generated_config=y
CONFIG_NUM_PREEMPT_PRIORITIES=12
CONFIG_configMAX_PRIORITIES=14
CONFIG_configTICK_RATE_HZ=1000
CONFIG_configMINIMAL_STACK_SIZE=320
CONFIG_configRECORD_STACK_HIGH_ADDRESS=y
CONFIG_configTIMER_TASK_STACK_DEPTH="(configMINIMAL_STACK_SIZE*8)"
CONFIG_configTIMER_QUEUE_LENGTH=10
CONFIG_configTOTAL_HEAP_SIZE=184320
CONFIG_configSUPPORT_STATIC_ALLOCATION=y
CONFIG_configUSE_IDLE_HOOK=y
CONFIG_configUSE_TICK_HOOK=y
CONFIG_configUSE_STATS_FORMATTING_FUNCTIONS=y
CONFIG_configUSE_APPLICATION_TASK_TAG=y
CONFIG_configENABLE_MPU=y
CONFIG_configENABLE_FPU=n

# Misc
CONFIG_DEBUG_CONSOLE_RX_ENABLE=n
CONFIG_DEBUG_CONSOLE_SYNCHRONIZATION_MODE=1
CONFIG_FSL_OSA_MAIN_FUNC_ENABLE=n
CONFIG_MCUX_PRJSEG_module.board.console_lite=n
CONFIG_MCUX_PRJSEG_module.board.console=y
