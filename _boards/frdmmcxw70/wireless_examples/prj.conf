# board config
CONFIG_MCUX_PRJSEG_module.board.boardfile=n
CONFIG_MCUX_PRJSEG_module.board.wireless.board=y
CONFIG_MCUX_PRJSEG_module.board.clock_customize_folder=y
CONFIG_MCUX_PRJSEG_module.board.wireless.clock=y
CONFIG_MCUX_PRJSEG_project.hw_app_customize_folder=y
CONFIG_MCUX_PRJSEG_module.board.wireless.hw_app=y
CONFIG_MCUX_PRJSEG_module.board.wireless.app_services=y
CONFIG_MCUX_PRJSEG_module.board.pinmux_project_core_folder=n
CONFIG_MCUX_PRJSEG_module.board.pinmux_project_folder=y

CONFIG_MCUX_PRJSEG_middleware.multicore.rpmsg-lite.generated_config=n

CONFIG_MCUX_PRJSEG_module.board.wireless.board.dcdc=n

CONFIG_MCUX_COMPONENT_component.software_rng_adapter=y

# Async flash mode is enabled by the connectivity kw43_mcxw70 platform component.
# Set the queue/buffer sizes here (wireless examples only) for a good balance of
# memory usage vs performance. These symbols depend on FLASH_K4_ASYNC_MODE, so
# they are scoped to wireless examples and do not affect non-async examples.
CONFIG_FLASH_K4_ASYNC_QUEUE_SIZE=32
CONFIG_FLASH_K4_ASYNC_TOTAL_BUFFER_SIZE=512
