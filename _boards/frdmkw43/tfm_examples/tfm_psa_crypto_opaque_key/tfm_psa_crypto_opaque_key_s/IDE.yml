flash_programming_file:
  files:
  - source: ${board_root}/${board}/tfm_examples/tfm_psa_crypto_opaque_key/tfm_psa_crypto_opaque_key_s/tfm_psa_crypto_opaque_key_flashdownload.ini
    attribute: flash_programming_file
    toolchains: mdk
    targets: debug release
initialization_file:
  files:
  - source: ${board_root}/${board}/tfm_examples/tfm_psa_crypto_opaque_key/tfm_psa_crypto_opaque_key_s/tfm_psa_crypto_opaque_key_flashdebug.ini
    attribute: initialization_file
    toolchains: mdk
    targets: debug release
mdk:
  shared-workspace: tfm_psa_crypto_opaque_key
  sharing-workspace:
  - ../../tfm_psa_crypto_opaque_key_ns/mdk/tfm_psa_crypto_opaque_key_ns
  - ../../tfm_s_crypto_clients/mdk/tfm_s_crypto_clients
iar:
  shared-workspace: tfm_psa_crypto_opaque_key
  sharing-workspace:
  - ../../tfm_psa_crypto_opaque_key_ns/iar/tfm_psa_crypto_opaque_key_ns
  - ../../tfm_s_crypto_clients/iar/tfm_s_crypto_clients
  config:
    __common__:
      download-extra-image:
      - path: "../../tfm_psa_crypto_opaque_key_ns/iar/tfm_psa_crypto_opaque_key_ns.out"
        item: 1
        offset: 0
        debug_info_only: false
  project-templates:
  - scripts/guigenerator/templates/iar/app_cmsisdap/generic_dsp.ewp
  - scripts/guigenerator/templates/iar/app_cmsisdap/generic.ewd
  - scripts/guigenerator/templates/iar/general.eww