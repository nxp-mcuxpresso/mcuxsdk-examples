flash_programming_file:
  files:
  - source: ${board_root}/${board}/tfm_examples/tfm_regression/tfm_regression_s/tfm_regression_flashdownload.ini
    attribute: flash_programming_file
    toolchains: mdk
    targets: debug release
initialization_file:
  files:
  - source: ${board_root}/${board}/tfm_examples/tfm_regression/tfm_regression_s/tfm_regression_flashdebug.ini
    attribute: initialization_file
    toolchains: mdk
    targets: debug release
mdk:
  shared-workspace: tfm_regression
  sharing-workspace:
  - ../../tfm_regression_ns/mdk/tfm_regression_ns
  - ../../tfm_s_crypto_clients/mdk/tfm_s_crypto_clients
  - ../../tfm_s_reg_suites/mdk/tfm_s_reg_suites
iar:
  shared-workspace: tfm_regression
  sharing-workspace:
  - ../../tfm_regression_ns/iar/tfm_regression_ns
  - ../../tfm_s_crypto_clients/iar/tfm_s_crypto_clients
  - ../../tfm_s_reg_suites/iar/tfm_s_reg_suites
  config:
    __common__:
      download-extra-image:
      - path: "../../tfm_regression_ns/iar/tfm_regression_ns.out"
        item: 1
        offset: 0
        debug_info_only: false
  project-templates:
  - scripts/guigenerator/templates/iar/app_cmsisdap/generic_dsp.ewp
  - scripts/guigenerator/templates/iar/app_cmsisdap/generic.ewd
  - scripts/guigenerator/templates/iar/general.eww