#select profile
CONFIG_MCUX_COMPONENT_middleware.tfm.profile_medium=y

#mcxw23 tfm flash config
CONFIG_MCUX_COMPONENT_middleware.tfm.flash_mcxw23=y

#mbedtls configs
CONFIG_MCUX_COMPONENT_component.psa_crypto_driver.casper=y
CONFIG_MCUX_COMPONENT_component.psa_crypto_driver.hashcrypt=y

#drivers
CONFIG_MCUX_COMPONENT_middleware.tfm.usart=y
CONFIG_MCUX_COMPONENT_driver.flexcomm=y
CONFIG_MCUX_COMPONENT_driver.ctimer=y
CONFIG_MCUX_COMPONENT_driver.trng=y

#include pin_mux board component
CONFIG_MCUX_PRJSEG_module.board.pinmux_board_folder=y
