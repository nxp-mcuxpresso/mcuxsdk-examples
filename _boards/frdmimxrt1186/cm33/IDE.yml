mdk:
  project-templates:
    - scripts/guigenerator/templates/mdk/app_frdmimxrt1186/app_frdmimxrt1186_cm33.uvprojx
    - scripts/guigenerator/templates/mdk/app_frdmimxrt1186/app_frdmimxrt1186_cm33.uvoptx
  config:
    flexspi_nor_debug:
      update-before-debug: true
    flexspi_nor_release:
      update-before-debug: true
    flexspi_nor_hyperram_debug:
      update-before-debug: true
    flexspi_nor_hyperram_release:
      update-before-debug: true

iar:
  project-templates:
    - scripts/guigenerator/templates/iar/app_cmsisdap/generic_dsp.ewp
    - scripts/guigenerator/templates/iar/app_cmsisdap/generic.ewd
    - scripts/guigenerator/templates/iar/general.eww
  config:
    __common__:
      debugger_setting:
        cmsisdap_resetlist: system

jlink_script_file:
  files:
    - source: ${board_root}/frdmimxrt1186/jlinkscript/frdmimxrt1186_cm33.jlinkscript
      attribute: jlink_script_file
      toolchains: iar mdk
      choose: true

macro-file:
  files:
    - source: ${board_root}/frdmimxrt1186/frdmimxrt1186.mac
      attribute: macro-file
      toolchains: iar
      choose: true

initialization_file:
  files:
    - source: ${board_root}/frdmimxrt1186/frdmimxrt1186_ram_cm33.ini
      attribute: initialization_file
      toolchains: mdk
      targets: debug release
               hyperram_debug hyperram_release

    - source: ${board_root}/frdmimxrt1186/frdmimxrt1186_flexspi_nor_cm33.ini
      attribute: initialization_file
      toolchains: mdk
      targets: flexspi_nor_debug flexspi_nor_release
               flexspi_nor_hyperram_debug flexspi_nor_hyperram_release

    - source: ${board_root}/frdmimxrt1186/frdmimxrt1186_hyperram_txt_cm33.ini
      attribute: initialization_file
      toolchains: mdk
      targets: hyperram_txt_debug hyperram_txt_release

