FUNC void _FLEXSPI1_ModuleReset(void)
{
    unsigned int reg;
    
    reg = _RDWORD(0x425E0000);  // FlexSPI1->MCR0
    if( (reg & 0x02) == 0)  // Module Enabled
    {
        reg = _RDWORD(0x425E0000);
        _WDWORD(0x425E0000, (reg | 0x1));
        do
        {
            reg = _RDWORD(0x425E0000);
        } while ((reg & 0x1) != 0);
    }
}

FUNC void _FLEXSPI1_WaitBusIdle(void)
{
    unsigned int reg;
    reg = _RDWORD(0x425E0000);  // FlexSPI1->MCR0
    if( (reg & 0x02) == 0)  // Module Enabled
    {
        do
        {
            reg = _RDWORD(0x425E00E0);
        } while ((reg & 0x3) != 0x3);
    }
}

FUNC void _FLEXSPI1_ClockInit(void)
{
    _WDWORD(0x54484350, 0x0);  // ROSC400M_CTRL1
    
    // Set flexspi1 root clock, use ROSC400, div = 2 = 1+1
    _WDWORD(0x44450A80, 0x101);     // CLOCK_ROOT[21].CONTROL, FlexSPI1
}

FUNC void _FlexSPI1_SetPinForOctalMode(void)
{
    // Config IOMUX for FlexSPI1
    _WDWORD(0x42A101D4, 0x00000011); // IOMUXC_GPIO_SD_B2_08_FLEXSPI1_BUS2BIT_B_DATA00
    _WDWORD(0x42A101D8, 0x00000011); // IOMUXC_GPIO_SD_B2_09_FLEXSPI1_BUS2BIT_B_DATA01
    _WDWORD(0x42A101DC, 0x00000011); // IOMUXC_GPIO_SD_B2_10_FLEXSPI1_BUS2BIT_B_DATA02
    _WDWORD(0x42A101E0, 0x00000011); // IOMUXC_GPIO_SD_B2_11_FLEXSPI1_BUS2BIT_B_DATA03
    _WDWORD(0x42A101B4, 0x00000011); // IOMUXC_GPIO_SD_B2_00_FLEXSPI1_BUS2BIT_B_DATA04
    _WDWORD(0x42A101B8, 0x00000011); // IOMUXC_GPIO_SD_B2_01_FLEXSPI1_BUS2BIT_B_DATA05
    _WDWORD(0x42A101BC, 0x00000011); // IOMUXC_GPIO_SD_B2_02_FLEXSPI1_BUS2BIT_B_DATA06
    _WDWORD(0x42A101C0, 0x00000011); // IOMUXC_GPIO_SD_B2_03_FLEXSPI1_BUS2BIT_B_DATA07
    _WDWORD(0x42A101CC, 0x00000011); // IOMUXC_GPIO_SD_B2_06_FLEXSPI1_BUS2BIT_B_SS0_B
    _WDWORD(0x42A101C8, 0x00000011); // IOMUXC_GPIO_SD_B2_05_FLEXSPI1_BUS2BIT_B_DQS
    _WDWORD(0x42A101D0, 0x00000011); // IOMUXC_GPIO_SD_B2_07_FLEXSPI1_BUS2BIT_B_SCLK

    //The input daisy!!
    _WDWORD(0x42A10548, 0x00000000); // FLEXSPI1_B_DQS
    _WDWORD(0x42A1054C, 0x00000000); // FLEXSPI1_B_DATA00
    _WDWORD(0x42A10550, 0x00000000); // FLEXSPI1_B_DATA01
    _WDWORD(0x42A10554, 0x00000000); // FLEXSPI1_B_DATA02
    _WDWORD(0x42A10558, 0x00000000); // FLEXSPI1_B_DATA03
    _WDWORD(0x42A1055C, 0x00000000); // FLEXSPI1_B_DATA04
    _WDWORD(0x42A10560, 0x00000000); // FLEXSPI1_B_DATA05
    _WDWORD(0x42A10564, 0x00000000); // FLEXSPI1_B_DATA06
    _WDWORD(0x42A10568, 0x00000000); // FLEXSPI1_B_DATA07
    _WDWORD(0x42A1056C, 0x00000000); // FLEXSPI1_B_SCLK

    // PAD ctrl
    _WDWORD(0x42A1041C, 0x00000008); // FLEXSPI1_B_DATA00
    _WDWORD(0x42A10420, 0x00000008); // FLEXSPI1_B_DATA01
    _WDWORD(0x42A10424, 0x00000008); // FLEXSPI1_B_DATA02
    _WDWORD(0x42A10428, 0x00000008); // FLEXSPI1_B_DATA03
    _WDWORD(0x42A103FC, 0x00000008); // FLEXSPI1_B_DATA04
    _WDWORD(0x42A10400, 0x00000008); // FLEXSPI1_B_DATA05
    _WDWORD(0x42A10404, 0x00000008); // FLEXSPI1_B_DATA06
    _WDWORD(0x42A10408, 0x00000008); // FLEXSPI1_B_DATA07
    _WDWORD(0x42A10414, 0x00000008); // FLEXSPI1_B_SS0_B
    _WDWORD(0x42A10410, 0x00000008); // FLEXSPI1_B_DQS
    _WDWORD(0x42A10418, 0x00000008); // FLEXSPI1_B_SCLK
}

FUNC void _FLEXSPI1_ModuleInit(void)
{
    // Config FlexSPI1 Registers

    unsigned int reg;
    reg = _RDWORD(0x425E0000);
    _WDWORD(0x425E0000, (reg & 0xFFFFFFFD));

    _FLEXSPI1_ModuleReset();

    _WDWORD(0x425E0000, 0xFFFF3032); // MCR0
    _WDWORD(0x425E0004, 0xFFFFFFFF); // MCR1
    _WDWORD(0x425E0008, 0x200001F7); // MCR2
    _WDWORD(0x425E000C, 0x00000078); // AHBCR prefetch enable
    _WDWORD(0x425E0020, 0x800F0000); // AHBRXBUF0CR0
    _WDWORD(0x425E0024, 0x800F0000); // AHBRXBUF1CR0
    _WDWORD(0x425E0028, 0x800F0000); // AHBRXBUF2CR0
    _WDWORD(0x425E002C, 0x800F0000); // AHBRXBUF3CR0
    _WDWORD(0x425E0030, 0x800F0000); // AHBRXBUF4CR0
    _WDWORD(0x425E0034, 0x800F0000); // AHBRXBUF5CR0
    _WDWORD(0x425E0038, 0x80000020); // AHBRXBUF6CR0
    _WDWORD(0x425E003C, 0x80000020); // AHBRXBUF7CR0
    _WDWORD(0x425E00B8, 0x00000000); // IPRXFCR
    _WDWORD(0x425E00BC, 0x00000000); // IPTXFCR

    _WDWORD(0x425E0060, 0x00000000); // FLASHA1CR0
    _WDWORD(0x425E0064, 0x00000000); // FLASHA2CR0
    _WDWORD(0x425E0068, 0x00000000); // FLASHB1CR0
    _WDWORD(0x425E006C, 0x00000000); // FLASHB2CR0

    _FLEXSPI1_WaitBusIdle();

    _WDWORD(0x425E0060, 0x00002000); // FLASHA1CR0
    _WDWORD(0x425E0070, 0x00021C63); // FLASHA1CR1 
    _WDWORD(0x445E0080, 0x00000100); // FLASHA1CR2

    _FLEXSPI1_WaitBusIdle();

    _WDWORD(0x425E00C0, 0x00000079); // DLLCRA   
    _WDWORD(0x425E0000, 0xFFFF3030); // MCR0

    do
    {
        reg = _RDWORD(0x425E00E8);
    } while (0x3 != (reg & 0x3));
    _Sleep_(1);
    // __delay(100);//100us

    _WDWORD(0x425E0000, 0xFFFF3032); // MCR0
    _WDWORD(0x425E0094, 0x000000C2); // FLASHCR4 
    _WDWORD(0x425E0094, 0x000000C6); // FLASHCR4
    _WDWORD(0x425E0000, 0xFFFF3030); // MCR0

    _FLEXSPI1_WaitBusIdle();

    _WDWORD(0x425E0018, 0x5AF05AF0); // LUTKEY
    _WDWORD(0x425E001C, 0x00000002); // LUTCR
    _WDWORD(0x425E0200, 0x8B1887A0); // LUT[0]
    _WDWORD(0x425E0204, 0xB7078F10); // LUT[1]
    _WDWORD(0x425E0208, 0x0000A704); // LUT[2]
    _WDWORD(0x425E020C, 0x00000000); // LUT[3] 
    _WDWORD(0x425E0210, 0x8B188720); // LUT[4]
    _WDWORD(0x425E0214, 0xB7078F10); // LUT[5]
    _WDWORD(0x425E0218, 0x0000A304); // LUT[6]
    _WDWORD(0x425E021C, 0x00000000); // LUT[7]
    _WDWORD(0x425E0220, 0x8B1887E0); // LUT[8]
    _WDWORD(0x425E0224, 0xB7078F10); // LUT[9]
    _WDWORD(0x425E0228, 0x0000A704); // LUT[10]
    _WDWORD(0x425E022C, 0x00000000); // LUT[11]
    _WDWORD(0x425E0230, 0x8B188760); // LUT[12]
    _WDWORD(0x425E0234, 0xA3028F10); // LUT[13]
    _WDWORD(0x425E0238, 0x00000000); // LUT[14]
    _WDWORD(0x425E023C, 0x00000000); // LUT[15]
    _WDWORD(0x425E0240, 0x00000000); // LUT[16]
    _WDWORD(0x425E0244, 0x00000000); // LUT[17]
    _WDWORD(0x425E0248, 0x00000000); // LUT[18]
    _WDWORD(0x425E024C, 0x00000000); // LUT[19]
    _WDWORD(0x425E0018, 0x5AF05AF0); // LUTKEY
    _WDWORD(0x425E001C, 0x00000001); // LUTCR

    /* Restore hyperram CR0 register */
    _WDWORD(0x425E00A0, 0x00001000); // IPCR0
    _WDWORD(0x425E00A4, 0x00030002); // IPCR1
    _WDWORD(0x425E00BC, 0x00000001); // IPTXFCR
    _WDWORD(0x425E0180, 0x2F8F2F8F); // TFDR     0x8F2F is default value of W756/7x of CR0
    _WDWORD(0x425E0014, 0x00000040); // INTR
    _WDWORD(0x425E00B0, 0x00000001); // IPCMD
    do
    {
        reg = _RDWORD(0x425E0014); // INTR
    } while ((reg & 0x1) == 0x0);
    _WDWORD(0x425E0014, 0x00000001); // INTR

    /* Restore hyperram CR1 register */
    _WDWORD(0x425E00A0, 0x00001002); // IPCR0
    _WDWORD(0x425E00A4, 0x00030002); // IPCR1
    _WDWORD(0x425E00BC, 0x00000001); // IPTXFCR
    _WDWORD(0x425E0180, 0xC1FFC1FF); // TFDR      0xFFC1 is default value of W756/7x of CR1
    _WDWORD(0x425E0014, 0x00000040); // INTR
    _WDWORD(0x425E00B0, 0x00000001); // IPCMD
    do
    {
        reg = _RDWORD(0x425E0014); // INTR
    } while ((reg & 0x1) == 0x0);
    _WDWORD(0x425E0014, 0x00000001); // INTR

    _FLEXSPI1_ModuleReset();
}

FUNC void _FLEXSPI2_ModuleReset(void)
{
    unsigned int reg;

    reg = _RDWORD(0x445E0000);  // FlexSPI2->MCR0
    if( (reg & 0x02) == 0)  // Module Enabled
    {
        reg = _RDWORD(0x445E0000);
        _WDWORD(0x445E0000, (reg | 0x1));
        do
        {
            reg = _RDWORD(0x445E0000);
        } while ((reg & 0x1) != 0);
    }
}

FUNC void _FLEXSPI2_WaitBusIdle(void)
{
    unsigned int reg;

    reg = _RDWORD(0x445E0000);  // FlexSPI2->MCR0
    if( (reg & 0x02) == 0)  // Module Enabled
    {
        do
        {
            reg = _RDWORD(0x445E00E0);
        } while ((reg & 0x3) != 0x3);
    }
}

FUNC void _FLEXSPI2_SetPinForQuadMode(void) {
    // Set 4 Pin Mode
    // IOMUXC_GPIO_AON_21_FLEXSPI2_BUS2BIT_A_DQS
    _WDWORD(0x443C0054, 0x18);
    _WDWORD(0x42A10570, 0x1);
    // IOMUXC_GPIO_AON_23_FLEXSPI2_BUS2BIT_A_SCLK
    _WDWORD(0x443C005C, 0x10);
	_WDWORD(0x42A10598, 0x1);
    // IOMUXC_GPIO_AON_22_FLEXSPI2_BUS2BIT_A_SS0_B
    _WDWORD(0x443C0058, 0x10);
    // IOMUXC_GPIO_AON_24_FLEXSPI2_BUS2BIT_A_DATA00
    _WDWORD(0x443C0060, 0x10);
	_WDWORD(0x42A10578, 0x1);
    // IOMUXC_GPIO_AON_25_FLEXSPI2_BUS2BIT_A_DATA01
    _WDWORD(0x443C0064, 0x10);
	_WDWORD(0x42A1057C, 0x1);
    // IOMUXC_GPIO_AON_26_FLEXSPI2_BUS2BIT_A_DATA02
    _WDWORD(0x443C0068, 0x10);
	_WDWORD(0x42A10580, 0x1);
    // IOMUXC_GPIO_AON_27_FLEXSPI2_BUS2BIT_A_DATA03
    _WDWORD(0x443C006C, 0x10);
	_WDWORD(0x42A10584, 0x1);
}

FUNC void _FLEXSPI2_ClockInit(void)
{
    _WDWORD(0x54484350, 0x0);  // ROSC400M_CTRL1

    // Set flexspi2 root clock, use ROSC400, div = 4 = 1+3
    _WDWORD(0x44450B00, 0x103);     // CLOCK_ROOT[22].CONTROL, FlexSPI2
}
