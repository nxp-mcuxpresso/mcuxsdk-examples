            package_path: boards/${board}/multicore_examples/rpmsg_lite_pingpong_rtos/mcu/master/${multicore_foldername}
            project_path: source
          as-include:
          - path: boards/${board}/freertos_config_board/${multicore_foldername}
            package_path: boards/${board}/multicore_examples/rpmsg_lite_pingpong_rtos/mcu/master/${multicore_foldername}
            project_path: source
          - path: boards/${board}/multicore_examples/rpmsg_lite_pingpong_rtos/mcu/master
