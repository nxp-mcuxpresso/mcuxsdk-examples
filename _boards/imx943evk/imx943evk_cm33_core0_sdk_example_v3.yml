---
# yaml-language-server: $schema=../../bin/generator/sdk_generator/data/sdk_data_schema/v3/software_set_and_project_schema.json

__safe_load__:
- bin/generator/records_v3/shared/project/sdk_example/common/lpc/component_examples_lpc.yml
- boards/src/driver_examples/i3c/driver_example_lpc_v3.yml
- middleware/multicore/example/multicore_examples/multicore_examples_kinetis_v3.yml
- middleware/lwip/example/lwip_examples_kinetis_v3.yml
- bin/generator/records_v3/shared/project/sdk_example/common/kinetis/component_examples.yml
- bin/generator/records_v3/shared/project/sdk_example/common/kinetis/cmsis_driver_example.yml
- bin/generator/records_v3/set/device/MIMX94398/index_cm33_core0.yml
- bin/generator/records_v3/set/board/imx943evk/project_segment_imx943evk_cm33_core0.yml
- middleware/voice_spot/sdk_examples/voice_spot_examples_v3.yml
- bin/generator/records_v3/shared/project/sdk_example/common/kinetis/driver_example.yml
- middleware/fatfs/example/fatfs_examples_kinetis_v3.yml
- bin/generator/records_v3/shared/project/sdk_example/common/kinetis/demo_app.yml
- middleware/mbedtls/example/mbedtls_examples_kinetis_v3.yml
__variable__:
  ConfigName_var: ConfigName
__hierarchy__:
  tmp_imx943evk_configurations_components:
    section-type: application
    belong_to: "set.board.${board}"
    __remove__:
      dependency:
      - driver.port
    dependency:
    - component.sm_clock
    - driver.clock
    - driver.fract_pll
    - driver.ccm
    - driver.src1
    - driver.reset
    - driver.supply
    - driver.power
    - driver.cpu
    - driver.elec_spec
    - component.sm.imx943_cm33_core0
    - component.hal_clock
    - component.hal_clock.imx943
    - component.sm_pinctrl
    - driver.iomuxc
    - component.hal_pinctrl
    - component.hal_pinctrl.imx943
    - component.hal_power
    - component.hal_power.imx943
    - component.sm.smt
    - component.sm.crc
    - component.sm.scmi
    - driver.common
    - "device.${platform_devices_soc_name}_CMSIS"
    - utility.debug_console
    - utility.assert
    - component.lpuart_adapter
    - component.serial_manager_uart
    - component.serial_manager
    - driver.lpuart
    - component.lists
    - "device.${platform_devices_soc_name}_startup"
    - driver.rgpio
    - driver.cache_xcache
    - driver.adp5585
    - driver.pcal6524
    - driver.pca6416a
    - driver.irqsteer_1
    - driver.irqsteer_soc.${multicore_foldername}
    - driver.lpi2c
    merge_segment:
    - imx943evk_options
    - imx943evk_flash_options
    - config_nonsm
    contents:
      document:
        platform_devices_soc_name: MIMX94398
        board: imx943evk
        core: cm33
        core_id: cm33_core0
        device_id: "${platform_devices_soc_name}"
        fpu: SP_FPU
        compilers:
        - armclang
      configuration:
        tools:
          __remove__:
            mdk:
            dsmdk:
          __common__:
            binary-file: sdk20-app.bin
            config:
              __common__: {}
          iar:
            project-templates:
            - bin/generator/templates/iar/app_jlinkswd_m33/generic.ewd
            - bin/generator/templates/iar/app_jlinkswd_m33/generic_trustzone.ewp
            - bin/generator/templates/iar/general.eww
          armgcc:
          mcux:
            ignore: 'true'
      modules:
        linker-file:
          files:
          - source: devices/MIMX94398/iar/MIMX94398_cm33_core0_ram.icf
            attribute: linker-file
            toolchains: iar
            targets: "debug release"
            project_path: MIMX94398/iar
          - source: devices/MIMX94398/gcc/MIMX94398_cm33_core0_ram.ld
            attribute: linker-file
            toolchains: armgcc
            targets: "debug release"
            project_path: MIMX94398/gcc
          - source: devices/MIMX94398/iar/MIMX94398_cm33_core0_flash.icf
            attribute: linker-file
            toolchains: iar
            targets: "flash_debug flash_release"
            project_path: MIMX94398/iar
          - source: devices/MIMX94398/gcc/MIMX94398_cm33_core0_flash.ld
            attribute: linker-file
            toolchains: armgcc
            targets: "flash_debug flash_release"
            project_path: MIMX94398/gcc
config_sm:
  section-type: project_segment
  belong_to: "set.board.${board}"
  contents:
    configuration:
      tools:
        __common__:
          config:
            __common__:
              cc-define:
                FSL_SDK_DISABLE_DRIVER_CLOCK_CONTROL=1:
    modules:
      hal_config_sm:
        cc-include:
        - path: "boards/${board}/sm/"
          project_path: boards/${board}/sm
        files:
        - source: boards/${board}/sm/hal_config.h
          project_path: boards/${board}/sm
config_nonsm:
  internal: true
  section-type: project_segment
  belong_to: "set.board.${board}"
  contents:
    modules:
      hal_config_nonsm:
        cc-include:
        - path: "boards/${board}/nonsm/"
          project_path: boards/${board}/nonsm
        files:
        - source: boards/${board}/nonsm/hal_config.h
          project_path: boards/${board}/nonsm
app.srtm:
  section-type: project_segment
  belong_to: "set.board.${board}"
  contents:
    configuration:
      tools:
        __common__:
          config:
            __common__:
              cc-define:
                SDK_I2C_BASED_COMPONENT_USED=1:
    modules:
      app.srtm:
        cc-include:
        - path: components/srtm/channels
          project_path: srtm/channels
        - path: components/srtm/services
          project_path: srtm/services
        files:
        - source: components/srtm/channels/srtm_rpmsg_endpoint.h
          project_path: srtm/channels
        - source: components/srtm/channels/srtm_rpmsg_endpoint.c
          project_path: srtm/channels
        - source: components/srtm/services/srtm_audio_service.h
          project_path: srtm/services
        - source: components/srtm/services/srtm_audio_service.c
          project_path: srtm/services
        - source: components/srtm/services/srtm_sai_edma_adapter.h
          project_path: srtm/services
        - source: components/srtm/services/srtm_sai_edma_adapter.c
          project_path: srtm/services
        - source: components/srtm/services/srtm_pdm_edma_adapter.h
          project_path: srtm/services
        - source: components/srtm/services/srtm_pdm_edma_adapter.c
          project_path: srtm/services
        - source: components/srtm/services/srtm_i2c_service.h
          project_path: srtm/services
        - source: components/srtm/services/srtm_i2c_service.c
          project_path: srtm/services
coremark:
  section-type: application
  internal: true
  required: true
  belong_to: "set.board.${board}"
  dependency:
  - driver.lptmr
  contents:
    document:
      __replace__:
      name: "coremark_${multicore_foldername}"
rpmsg_lite_pingpong_rtos_linux_remote:
  section-type: application
  required: true
  belong_to: "set.board.${board}"
  dependency:
  - middleware.multicore.rpmsg_lite.imx943_m33_freertos
  - middleware.multicore.rpmsg_lite.freertos
