hello_world:
  section-type: application
  required: true
  belong_to: "set.board.${board}"
  contents:
    document:
      __replace__:
      name: "hello_world_${multicore_foldername}"
hello_world_s:
  section-type: application
  required: true
  internal: true
  belong_to: "set.board.${board}"
  dependency:
  - utility.debug_console_lite
  - utility.assert_lite
  - driver.trdc_1
  __remove__:
    dependency:
    - utility.debug_console
    - utility.assert
    - component.serial_manager
    - component.serial_manager_uart
    - driver.port
  contents:
    configuration:
      tools:
        __common__:
          config:
            __common__:
        armgcc:
          config:
            __common__:
              cc-flags:
              - -mcmse
              cx-flags:
              - -mcmse
            debug:
              as-define:
                DEMO_CODE_START_NS: 268369920
              cc-define:
                DEMO_CODE_START_NS: 268369920
              ld-flags:
              - "-Wl,--cmse-implib"
              - "-Wl,--out-implib=./debug/hello_world_s_CMSE_lib.o"
            release:
              as-define:
                DEMO_CODE_START_NS: 268369920
              cc-define:
                DEMO_CODE_START_NS: 268369920
              ld-flags:
              - "-Wl,--cmse-implib"
              - "-Wl,--out-implib=./release/hello_world_s_CMSE_lib.o"
            __remove__:
              flash_debug:
              flash_release:
        iar:
          shared-workspace: hello_world
          sharing-workspace:
          - hello_world_ns
          config:
            __common__:
              cc-flags:
              - --cmse
              cx-flags:
              - --cmse
            debug:
