        required: true
        cc-include:
        - path: boards/${board}
          package_path: boards/${board}/multicore_examples/rpmsg_lite_pingpong_rtos/mcu/master/${multicore_foldername}
          project_path: remoteproc
        - path: middleware/multicore/remoteproc
