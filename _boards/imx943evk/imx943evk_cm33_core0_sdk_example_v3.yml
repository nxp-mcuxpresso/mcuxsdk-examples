    configuration:
      tools:
        __common__:
          binary-file: rpmsg_lite_str_echo_rtos.bin
        armgcc:
          binary_packed: release
    modules:
      __remove__:
        default-remoteproc-rsc-table:
    document:
      __replace__:
      name: "rpmsg_lite_str_echo_rtos_imxcm33_${multicore_foldername}"
