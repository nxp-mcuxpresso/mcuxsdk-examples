# ---------------------------------------------------------------------------
# Default: standard hello_world on the physical debug UART (LPUART).
# Every core prints/reads directly on its own physical debug console.
# ---------------------------------------------------------------------------
CONFIG_MCUX_COMPONENT_driver.lpuart=y
CONFIG_MCUX_COMPONENT_utility.debug_console_lite=y
CONFIG_MCUX_COMPONENT_utility.assert_lite=y

# ---------------------------------------------------------------------------
# OPTIONAL: serial_mux (single physical UART shared by several cores).
#
# To route this hello_world through the serial_mux over shared memory instead
# of a physical UART, uncomment the block below. When enabled, cm7_core0 and
# cm7_core1 become mux clients (channel 0 / channel 1) whose console traffic
# is carried over shared memory to a hub. A SEPARATE core (cm33_core1) MUST
# then run the console_mux hub demo, which owns the one physical UART
# and multiplexes all client consoles onto it. See example_board_readme.md
# ("Serial mux (optional)") for the full procedure.
#
# The client console is an ordinary debug_console_lite on the serial_mux HAL
# UART adapter (components/uart/fsl_adapter_muxuart.c), whose HAL UART
# "instance" is the core's mux channel. Only one HAL UART adapter may be
# linked per image, hence lpuart_adapter must be off on the client cores.
#
# CONFIG_MCUX_COMPONENT_component.muxuart_adapter=y
# CONFIG_MCUX_COMPONENT_component.lpuart_adapter=n
# # Shared-memory slot region base (imx943evk cm33_core1 system OCRAM).
# CONFIG_MUX_REGION_ADDR=0x20800000
# # Number of non-hub client cores served by the hub (cm7_core0, cm7_core1).
# CONFIG_MUX_SLOTS_CORES=2
# ---------------------------------------------------------------------------
