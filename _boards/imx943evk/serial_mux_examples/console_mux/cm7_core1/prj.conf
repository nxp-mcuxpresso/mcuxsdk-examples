# Client core (cm7_core1, logical channel 1): console over the muxuart HAL UART adapter.
#
# The generic debug_console_lite is bound to component.muxuart_adapter, which
# implements the HAL_Uart* contract on top of a serial_mux client. That makes
# the console path adapter-generic: no serial_mux virtual backend and no
# client-side console frontend are needed on this core.
CONFIG_MCUX_COMPONENT_utility.debug_console_lite=y
CONFIG_MCUX_COMPONENT_utility.assert_lite=y

# Only one uart adapter may be linked per image: select muxuart and make sure
# no physical-UART adapter is pulled in on this core.
CONFIG_MCUX_COMPONENT_component.muxuart_adapter=y
CONFIG_MCUX_COMPONENT_component.lpuart_adapter=n

# Client role only: no hub, no UART transport, no console frontend.
CONFIG_MCUX_COMPONENT_component.serial_mux=y
CONFIG_MCUX_COMPONENT_component.serial_mux.slots=y
CONFIG_MCUX_COMPONENT_component.serial_mux.client=y
CONFIG_MCUX_COMPONENT_component.serial_mux.hub=n
CONFIG_MCUX_COMPONENT_component.serial_mux.transport=n
