# This example provides its own board bring-up (pin mux + clocks) in the
# per-core hardware_init.c overlay, so disable the auto-generated pinmux
# project folders.
CONFIG_MCUX_PRJSEG_module.board.pinmux_project_folder=n
CONFIG_MCUX_PRJSEG_module.board.pinmux_project_core_folder=n

# Shared-memory slot region base address (mandatory, no default in the
# serial_mux Kconfig): board-specific, so it lives in the imx943evk
# overlay rather than the generic demo. imx943evk: cm33_core1 system OCRAM.
CONFIG_MUX_REGION_ADDR=0x20800000

# Number of non-hub client cores served by the hub (MUX_SLOTS_CORES).
# Board-specific, so it lives in the imx943evk overlay: this board has
# 2 clients (cm7_core0 -> channel 0, cm7_core1 -> channel 1).
CONFIG_MUX_SLOTS_CORES=2

CONFIG_MUX_HUB_DEDICATED_CONSOLE=n
