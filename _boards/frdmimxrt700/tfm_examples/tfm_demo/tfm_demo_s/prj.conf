#select profile
CONFIG_MCUX_COMPONENT_middleware.tfm.profile_medium=y

# frdmimxrt700 flash config
CONFIG_MCUX_COMPONENT_middleware.tfm.flash_rt700=y
CONFIG_MCUX_COMPONENT_driver.cache_cache64=n
CONFIG_FLASH_DRIVER_EXECUTES_FROM_RAM=y

#drivers
CONFIG_MCUX_COMPONENT_middleware.tfm.lpuart=y
CONFIG_MCUX_COMPONENT_driver.ctimer=y
CONFIG_MCUX_COMPONENT_driver.cdog=y

#add default pin mux
CONFIG_MCUX_PRJSEG_module.board.pinmux_board_core_folder=y

