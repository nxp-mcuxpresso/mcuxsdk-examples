FUNC void Setup (void) 
{
    SP = _RDWORD(0x38004000);          // Setup Stack Pointer
    PC = _RDWORD(0x38004004);          // Setup Program Counter
    _WDWORD(0xE000ED08, 0x08001000);   // Setup Vector Table Offset Register
}

FUNC void OnResetExec(void)
{
    Setup();
}

