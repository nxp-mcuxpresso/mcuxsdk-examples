# Load FreeRTOS allocator
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.heap_4=y
# Load FreeRTOS trustzone
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.cm33_non_trustzone=y

# WiFi module
CONFIG_MCUX_COMPONENT_component.wifi_bt_module.IW61X=y
CONFIG_MCUX_COMPONENT_component.wifi_bt_module.board_murata_2el_m2=y

# Load middleware
CONFIG_MCUX_COMPONENT_middleware.wifi.sdio=y
CONFIG_MCUX_COMPONENT_middleware.sdmmc.host.usdhc=y
CONFIG_MCUX_COMPONENT_middleware.sdmmc.host.usdhc.non_blocking=y
CONFIG_MCUX_COMPONENT_middleware.sdmmc.sdio=y

# Load components
CONFIG_MCUX_COMPONENT_component.gpio_adapter=y
CONFIG_MCUX_COMPONENT_component.wifi_bt_module.config=y
CONFIG_MCUX_COMPONENT_component.wifi_bt_module.wifi_fw=y
