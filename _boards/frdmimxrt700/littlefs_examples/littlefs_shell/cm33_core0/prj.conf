# Disable CACHE64 driver — invalidation is handled directly inside mflash_drv.c
CONFIG_MCUX_COMPONENT_driver.cache_cache64=n

# LittleFS storage region: start at 4 MB offset (0x400000) inside the 32 MB flash
# Leaves first 4 MB for XIP code/data, the remaining 28 MB available for littlefs
CONFIG_LITTLEFS_START_ADDR=0x400000

# 4 KB sector matches erase unit
CONFIG_LITTLEFS_BLOCK_SIZE=4096

# 1024 blocks = 4 MB littlefs volume (adjust as needed)
CONFIG_LITTLEFS_BLOCK_COUNT=1024

# Use frdmimxrt700 mflash porting layer
CONFIG_MCUX_COMPONENT_component.mflash_offchip=y
