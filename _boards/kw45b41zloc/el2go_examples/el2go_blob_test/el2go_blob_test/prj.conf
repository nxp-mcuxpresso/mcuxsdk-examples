CONFIG_MCUX_COMPONENT_component.psa_crypto_driver.ele_s200=y
CONFIG_MCUX_COMPONENT_middleware.secure-subsystem=y
CONFIG_MCUX_COMPONENT_middleware.secure-subsystem.firmware=y
CONFIG_MCUX_COMPONENT_middleware.mbedtls3x.port.psa_crypto_config=y

# enable configs for usage platform spcefic flash drivers to be used with file system
CONFIG_MCUX_COMPONENT_component.mflash_onchip=y
CONFIG_MCUX_COMPONENT_driver.flash_k4=y

CONFIG_LITTLEFS_START_ADDR=0x80000
CONFIG_LITTLEFS_READ_SIZE=16
CONFIG_LITTLEFS_BLOCK_SIZE=8192
CONFIG_LITTLEFS_BLOCK_COUNT=64
CONFIG_LITTLEFS_PROG_SIZE=128
CONFIG_LITTLEFS_BLOCK_CYCLES=500
CONFIG_LITTLEFS_CACHE_SIZE=256
CONFIG_LITTLEFS_LOOKAHEAD_SIZE=16
