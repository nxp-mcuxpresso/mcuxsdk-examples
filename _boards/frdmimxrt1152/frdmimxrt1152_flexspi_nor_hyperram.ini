FUNC void restoreFlexRAM(void)
{
    unsigned int value;

    value = _RDWORD(0x400E4044);
    value &= ~(0xFFFF);
    value |= 0xFFAA;
    _WDWORD(0x400E4044, value);

    value = _RDWORD(0x400E4048);
    value &= ~(0xFFFF);
    value |= 0xFFAA;
    _WDWORD(0x400E4048, value);

    value = _RDWORD(0x400E4040);
    value &= ~(0xFF << 8);
    value |= 0x7 | (0xAA << 8);
    _WDWORD(0x400E4040, value);
}

FUNC void InitSysPll3(void)
{
  unsigned int val;

  val = _RDWORD(0x40C84210);
  if (val & 0x200000)
  {
    if ((val & 0x2000) == 0)
    {
      val |= 0x2000;
      _WDWORD(0x40C84210, val);
    }
    if (val & 0x40000000)
    {
      val &= ~0x40000000;
      _WDWORD(0x40C84210, val);
    }
    return;
  }

  val = _RDWORD(0x40C84230);
  val |= 0x80808080;
  _WDWORD(0x40C84230, val);

  val = _RDWORD(0x40C84210);
  val |= 0x10 | 0x40000000;
  _WDWORD(0x40C84210, val);
  _Sleep_(30);

  val = _RDWORD(0x40C84210);
  val |= 0x200000 | 0x800;
  _WDWORD(0x40C84210, val);
  _Sleep_(30);

  val = _RDWORD(0x40C84210);
  val &= ~0x800;
  _WDWORD(0x40C84210, val);

  do
  {
    val = _RDWORD(0x40C84210);
  } while ((val & 0x20000000) == 0);

  val |= 0x2000 | 0x8;
  _WDWORD(0x40C84210, val);

  val &= ~0x40000000;
  _WDWORD(0x40C84210, val);
}

FUNC void InitSysPll3Pfd0(void)
{
  unsigned int val;
  unsigned int stable;

  val = _RDWORD(0x40C84230);
  if (((val & 0x80) != 0) || ((val & 0x3F) != 13))
  {
    stable = val & 0x40;

    val |= 0x80;
    _WDWORD(0x40C84230, val);

    val = _RDWORD(0x40C84230);
    val &= ~0x3F;
    val |= 13;
    _WDWORD(0x40C84230, val);

    val = _RDWORD(0x40C84220);
    val ^= 0x2;
    _WDWORD(0x40C84220, val);

    val = _RDWORD(0x40C84230);
    val &= ~0x80;
    _WDWORD(0x40C84230, val);
    do
    {
      val = _RDWORD(0x40C84230) & 0x40;
    } while (val == stable);
  }
  else
  {
    val &= ~0x80;
    _WDWORD(0x40C84230, val);
  }
}

FUNC void _FLEXSPI2_ClockInit(void)
{
  InitSysPll3();
  InitSysPll3Pfd0();

  // FlexSPI2 clock root: MUX=4 (SYS_PLL3_PFD0), DIV=1 (/2) => 332.3 MHz
  _WDWORD(0x40CC0A80, 0x00000401);
}

FUNC void _FlexSPI2_SetPinForOctalMode(void)
{
  // Pin mux: ALT4 with SION for FlexSPI2 signals
  _WDWORD(0x400E80E0, 0x00000014); // FLEXSPI2_A_SCLK
  _WDWORD(0x400E80E4, 0x00000014); // FLEXSPI2_A_SS0_B
  _WDWORD(0x400E80E8, 0x00000014); // FLEXSPI2_A_DQS
  _WDWORD(0x400E80EC, 0x00000014); // FLEXSPI2_A_DATA00
  _WDWORD(0x400E80F0, 0x00000014); // FLEXSPI2_A_DATA01
  _WDWORD(0x400E80F4, 0x00000014); // FLEXSPI2_A_DATA02
  _WDWORD(0x400E80F8, 0x00000014); // FLEXSPI2_A_DATA03
  _WDWORD(0x400E80FC, 0x00000014); // FLEXSPI2_A_DATA04
  _WDWORD(0x400E8100, 0x00000014); // FLEXSPI2_A_DATA05
  _WDWORD(0x400E8104, 0x00000014); // FLEXSPI2_A_DATA06
  _WDWORD(0x400E8108, 0x00000014); // FLEXSPI2_A_DATA07

  // Pad config: drive strength and slew rate
  _WDWORD(0x400E8324, 0x0000000A);
  _WDWORD(0x400E8328, 0x0000000A);
  _WDWORD(0x400E832C, 0x0000000A);
  _WDWORD(0x400E8330, 0x0000000A);
  _WDWORD(0x400E8334, 0x0000000A);
  _WDWORD(0x400E8338, 0x0000000A);
  _WDWORD(0x400E833C, 0x0000000A);
  _WDWORD(0x400E8340, 0x0000000A);
  _WDWORD(0x400E8344, 0x0000000A);
  _WDWORD(0x400E8348, 0x0000000A);
  _WDWORD(0x400E834C, 0x0000000A);

  // SELECT_INPUT daisy chain
  _WDWORD(0x400E857C, 0x00000000);
  _WDWORD(0x400E8580, 0x00000000);
  _WDWORD(0x400E8584, 0x00000000);
  _WDWORD(0x400E8588, 0x00000000);
  _WDWORD(0x400E858C, 0x00000000);
}

FUNC void _FLEXSPI2_ModuleReset(void)
{
  unsigned int reg;
  reg = _RDWORD(0x400D0000);
  if ((reg & 0x02) == 0)
  {
    reg = _RDWORD(0x400D0000);
    _WDWORD(0x400D0000, (reg | 0x1));
    do
    {
      reg = _RDWORD(0x400D0000);
    } while ((reg & 0x1) != 0);
  }
}

FUNC void _FLEXSPI2_WaitBusIdle(void)
{
  unsigned int reg;
  reg = _RDWORD(0x400D0000);
  if ((reg & 0x02) == 0)
  {
    do
    {
      reg = _RDWORD(0x400D00E0);
    } while ((reg & 0x3) != 0x3);
  }
}

FUNC void _FLEXSPI2_ModuleInit(void)
{
  unsigned int reg;

  // Enable module (clear MDIS bit 1)
  reg = _RDWORD(0x400D0000);
  _WDWORD(0x400D0000, (reg & 0xFFFFFFFD));
  _FLEXSPI2_ModuleReset();

  // Module control registers
  _WDWORD(0x400D0000, 0xFFFF3032); // MCR0
  _WDWORD(0x400D0004, 0xFFFFFFFF); // MCR1
  _WDWORD(0x400D0008, 0x200001F7); // MCR2
  _WDWORD(0x400D000C, 0x00000078); // AHBCR

  // AHB RX buffers
  _WDWORD(0x400D0020, 0x800F0000);
  _WDWORD(0x400D0024, 0x800F0000);
  _WDWORD(0x400D0028, 0x800F0000);
  _WDWORD(0x400D002C, 0x800F0000);
  _WDWORD(0x400D0030, 0x800F0000);
  _WDWORD(0x400D0034, 0x800F0000);
  _WDWORD(0x400D0038, 0x80000020);
  _WDWORD(0x400D003C, 0x80000020);
  _WDWORD(0x400D00B8, 0x00000000); // IPRXFCR
  _WDWORD(0x400D00BC, 0x00000000); // IPTXFCR

  _FLEXSPI2_WaitBusIdle();

  // Flash size and timing
  _WDWORD(0x400D0060, 0x00008000); // FLASHA1CR0 - 32MB
  _WDWORD(0x400D0070, 0x00021C63); // FLASHA1CR1
  _WDWORD(0x400D0080, 0x00000100); // FLASHA1CR2

  _FLEXSPI2_WaitBusIdle();

  // DLL config
  _WDWORD(0x400D00C0, 0x00000079); // DLLCRA
  _WDWORD(0x400D0000, 0xFFFF3030); // MCR0 - exit stop mode

  // Wait for DLL lock
  do
  {
    reg = _RDWORD(0x400D00E8);
  } while (0x3 != (reg & 0x3));
  _Sleep_(1);

  // Configure write enable
  _WDWORD(0x400D0000, 0xFFFF3032); // MCR0 - stop mode
  _WDWORD(0x400D0094, 0x000000C2); // FLASHCR4
  _WDWORD(0x400D0094, 0x000000C6); // FLASHCR4
  _WDWORD(0x400D0000, 0xFFFF3030); // MCR0 - exit stop mode

  _FLEXSPI2_WaitBusIdle();

  // Program LUT
  _WDWORD(0x400D0018, 0x5AF05AF0); // LUTKEY
  _WDWORD(0x400D001C, 0x00000002); // LUTCR - unlock
  // Seq0 - HyperRAM Read
  _WDWORD(0x400D0200, 0x8B1887A0);
  _WDWORD(0x400D0204, 0xB7078F10);
  _WDWORD(0x400D0208, 0x0000A704);
  _WDWORD(0x400D020C, 0x00000000);
  // Seq1 - HyperRAM Write
  _WDWORD(0x400D0210, 0x8B188720);
  _WDWORD(0x400D0214, 0xB7078F10);
  _WDWORD(0x400D0218, 0x0000A304);
  _WDWORD(0x400D021C, 0x00000000);
  // Seq2 - HyperRAM Register Read
  _WDWORD(0x400D0220, 0x8B1887E0);
  _WDWORD(0x400D0224, 0xB7078F10);
  _WDWORD(0x400D0228, 0x0000A704);
  _WDWORD(0x400D022C, 0x00000000);
  // Seq3 - HyperRAM Register Write
  _WDWORD(0x400D0230, 0x8B188760);
  _WDWORD(0x400D0234, 0xA3048F10);
  _WDWORD(0x400D0238, 0x00000000);
  _WDWORD(0x400D023C, 0x00000000);
  // Unused
  _WDWORD(0x400D0240, 0x00000000);
  _WDWORD(0x400D0244, 0x00000000);
  _WDWORD(0x400D0248, 0x00000000);
  _WDWORD(0x400D024C, 0x00000000);
  _WDWORD(0x400D0018, 0x5AF05AF0); // LUTKEY
  _WDWORD(0x400D001C, 0x00000001); // LUTCR - lock

  // Restore HyperRAM CR0
  _WDWORD(0x400D00A0, 0x00001000); // IPCR0
  _WDWORD(0x400D00A4, 0x00030002); // IPCR1
  _WDWORD(0x400D00BC, 0x00000001); // IPTXFCR
  _WDWORD(0x400D0180, 0x2F8F2F8F); // TFDR
  _WDWORD(0x400D0014, 0x00000040); // INTR
  _WDWORD(0x400D00B0, 0x00000001); // IPCMD
  do
  {
    reg = _RDWORD(0x400D0014);
  } while ((reg & 0x1) == 0x0);
  _WDWORD(0x400D0014, 0x00000001);

  // Restore HyperRAM CR1
  _WDWORD(0x400D00A0, 0x00001002); // IPCR0
  _WDWORD(0x400D00A4, 0x00030002); // IPCR1
  _WDWORD(0x400D00BC, 0x00000001); // IPTXFCR
  _WDWORD(0x400D0180, 0xC1FFC1FF); // TFDR
  _WDWORD(0x400D0014, 0x00000040); // INTR
  _WDWORD(0x400D00B0, 0x00000001); // IPCMD
  do
  {
    reg = _RDWORD(0x400D0014);
  } while ((reg & 0x1) == 0x0);
  _WDWORD(0x400D0014, 0x00000001);

  _FLEXSPI2_ModuleReset();
}

FUNC void HyperRAM_Init(void)
{
  _FLEXSPI2_WaitBusIdle();
  _FLEXSPI2_ModuleReset();
  _FlexSPI2_SetPinForOctalMode();
  _FLEXSPI2_ClockInit();
  _FLEXSPI2_ModuleInit();
}

FUNC void Setup (void) {
  SP = _RDWORD(0x30002000);          // Setup Stack Pointer
  PC = _RDWORD(0x30002004);          // Setup Program Counter
  _WDWORD(0xE000ED08, 0x30002000);   // Setup Vector Table Offset Register
}

FUNC void OnResetExec (void)  {      // executes upon software RESET
  HyperRAM_Init();
  Setup();                           // Setup for Running
}

restoreFlexRAM();
HyperRAM_Init();

LOAD %L INCREMENTAL                  // Download

Setup();                             // Setup for Running

// g, main
