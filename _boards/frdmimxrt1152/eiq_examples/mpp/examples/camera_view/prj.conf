
CONFIG_MCUX_PRJSEG_module.board.pinmux_customize_folder=y
CONFIG_MCUX_PRJSEG_project.hw_app_customize_folder=y
CONFIG_MCUX_PRJSEG_module.board.display_support=y
CONFIG_MCUX_PRJSEG_middleware.freertos-kernel.generated_config=n
CONFIG_MCUX_COMPONENT_driver.pxp=y
CONFIG_MCUX_COMPONENT_driver.cache_armv7_m7=y
CONFIG_MCUX_COMPONENT_driver.gpt=y
CONFIG_MCUX_COMPONENT_middleware.eiq.tensorflow_lite_micro.binary=y
CONFIG_MCUX_COMPONENT_middleware.eiq.mpp=y
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.heap_4=y
# USB host stack (required when USE_USB_CAMERA is defined)
CONFIG_MCUX_COMPONENT_middleware.usb.common_header=y
CONFIG_MCUX_COMPONENT_middleware.usb.host.common_header=y
CONFIG_MCUX_COMPONENT_middleware.usb.host.ehci=y
CONFIG_MCUX_COMPONENT_middleware.usb.host.video=y
CONFIG_USB_HOST_CONFIG_VIDEO=1

CONFIG_MCUX_ABSTRACT_COMPONENT_component_expander=y
CONFIG_MCUX_COMPONENT_driver.pcal6524=y

# VGLite GPU support (for rotate+scale step in the pipeline)
CONFIG_MCUX_PRJSEG_module.board.vglite_support=y
CONFIG_MCUX_COMPONENT_middleware.vglite=y
