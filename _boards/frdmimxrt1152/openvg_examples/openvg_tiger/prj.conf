CONFIG_MCUX_PRJSEG_module.board.display_support=y
# Panel selection. The board default is RASPI_7INCH (DEMO_PANEL 5); select the
# RK055MHD091A0-CTG / RK055HDMIPI4MA0 MIPI panel instead (DEMO_PANEL 2).
CONFIG_RK055MHD091A0=y
CONFIG_MCUX_COMPONENT_driver.fbdev=y
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel=y
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.heap_4=y
CONFIG_MCUX_COMPONENT_middleware.openvg=y
CONFIG_MCUX_COMPONENT_driver.lpi2c=y
CONFIG_MCUX_COMPONENT_driver.pcal6524=y
CONFIG_MCUX_ABSTRACT_COMPONENT_component_expander=y
# The FreeRTOS kernel heap is a .bss array and must fit in the 6 MB cached
# data region left over once the 9 MB malloc() heap is carved out of the
# cached HyperRAM (see openvg_tiger_MIMXRT1152xxxxx_hyperram.icf/.ld).
CONFIG_configTOTAL_HEAP_SIZE=5242880
