CONFIG_MCUX_COMPONENT_driver.lpi2c=y
CONFIG_MCUX_COMPONENT_driver.pf9453=y

# Bound the LPI2C blocking waits so a stuck/NAKing PMIC bus returns kStatus_LPI2C_Timeout instead of
# hanging forever. Loop-iteration ceiling (not wall-clock); generous vs a healthy 100 kHz transfer,
# tune down after on-board measurement.
CONFIG_I2C_RETRY_TIMES=100000
