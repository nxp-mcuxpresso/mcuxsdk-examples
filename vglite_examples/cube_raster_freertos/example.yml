      - examples/vglite_examples/cube_raster_freertos/readme.md
      - ${board_root}/${board}/vglite_examples/cube_raster_freertos/example_board_readme.md
      - ${board_root}/${board}/examples_shared_readme.md
  boards:
    mimxrt2660evk:
    - +armgcc@psram_debug
    - +armgcc@psram_release
    - +armgcc@debug
    - +armgcc@release
    - +iar@debug
    - +iar@release
    - +iar@psram_debug
    - +iar@psram_release
    - -armgcc@xspi_nor_debug
    - -armgcc@xspi_nor_release
    - -iar@xspi_nor_debug
    - -iar@xspi_nor_release
