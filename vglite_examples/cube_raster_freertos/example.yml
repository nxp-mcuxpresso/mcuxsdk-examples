# yaml-language-server: $schema=../../../../scripts/data_schema/example_description_schema.json
cube_raster_freertos:
  section-type: application
  contents:
    meta_path: examples/vglite_examples/cube_raster_freertos
    project-root-path: boards/${board}/vglite_examples/cube_raster_freertos/${core_id}
    document:
      name: cube_raster_freertos${core_id_suffix_name}
