a-format_PWM_trigger:
  section-type: application
  contents:
    meta_path: examples/digital_encoder_examples/a-format/PWM_trigger
    project-root-path: boards/${board}/digital_encoder_examples/a-format/PWM_trigger/${multicore_foldername}
    document:
      name: a-format_PWM_trigger${core_id_suffix_name}
      category: digital_encoder_examples
      brief: The a-format_PWM_trigger example shows how to use flexio A-format driver
        in sync way:In this example, a flexio simulated A-format connect to the encoder
        through RS-485, the board will send requests triggered by the PWM to and receive
        responses from the encoder.
