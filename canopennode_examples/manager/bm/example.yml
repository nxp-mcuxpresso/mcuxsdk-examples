co_manager_bm:
  section-type: application
  contents:
    meta_path: examples/canopennode_examples/manager/bm/.
    project-root-path: boards/${board}/canopennode_examples/manager/bm/${multicore_foldername}
    document:
      name: co_manager_bm${core_id_suffix_name}
      category: canopennode_examples
      brief: The CANopen manager demo application demonstrates a CANopen manager on
        the CANopenNode stack.The application acts as a CANopen manager and manages
        a CANopen device.
      example_readme:
      - examples/canopennode_examples/manager/bm/readme.md
      - ${board_root}/${board}/canopennode_examples/manager/bm/example_board_readme.md
      - ${board_root}/${board}/examples_shared_readme.md
  boards:
    evkmimxrt1180@cm33:
    - -armgcc@debug
    - -armgcc@hyperram_debug
    - -armgcc@hyperram_release
    - -armgcc@release
    - -iar@debug
    - -iar@hyperram_debug
    - -iar@hyperram_release
    - -iar@release
    - -mdk@debug
    - -mdk@hyperram_debug
    - -mdk@hyperram_release
    - -mdk@release
    imx943evk@cm33_core1:
    - +armgcc@debug
    - +armgcc@release
    - +iar@release
    - +iar@debug
