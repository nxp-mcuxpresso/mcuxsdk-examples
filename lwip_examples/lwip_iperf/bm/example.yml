    meta_path: examples/lwip_examples/lwip_iperf/bm/.
    project-root-path: boards/${board}/lwip_examples/lwip_iperf/bm/${multicore_foldername}
    document:
      name: lwip_iperf_bm${core_id_suffix_name}
      category: lwip_examples
      brief: 'This is the IPerf server example to check your bandwidth using the network
        performance measurement IPerf application on a PC as a client.It is currently
        a minimal implementation providing an IPv4 TCP server only.Instead of the
        command line IPerf application, for more convenience, it is recommended to
        use the JPerf2 graphical tool, which can be downloaded here: https:/sourceforge.net/projects/iperf/files/jperf/jperf%202.0.0/jperf-2.0.0.zip/download'
      example_readme:
        - examples/lwip_examples/lwip_iperf/bm/readme.md
        - ${board_root}/${board}/lwip_examples/lwip_iperf/bm/example_board_readme.md
