CONFIG_MCUX_COMPONENT_component.silicon_id=y
CONFIG_MCUX_PRJSEG_module.board.console_lite=n
CONFIG_MCUX_PRJSEG_module.board.console=y
CONFIG_MCUX_COMPONENT_utility.debug_console=y
CONFIG_MCUX_PRJSEG_utility.debug_console_transfer_non_blocking=y

# lwIP configuration:
CONFIG_MCUX_COMPONENT_middleware.lwip=y
CONFIG_MCUX_COMPONENT_middleware.lwip.apps.lwiperf=y
CONFIG_MCUX_PRJSEG_middleware.lwip.generated_config=y
CONFIG_LWIP_OPT_H_CODE_LINE_1="void sys_check_core_locking(void);"
CONFIG_NO_SYS=y
CONFIG_LWIP_NETCONN=n
CONFIG_LWIP_SOCKET=n
CONFIG_ETH_MAX_RX_PKTS_AT_ONCE=5
CONFIG_LWIP_ASSERT_CORE_LOCKED( )="sys_check_core_locking()"
CONFIG_MEM_ALIGNMENT=4
CONFIG_MEM_SIZE=22528
CONFIG_MEMP_NUM_PBUF=15
CONFIG_MEMP_NUM_UDP_PCB=6
CONFIG_MEMP_NUM_TCP_PCB=10
CONFIG_MEMP_NUM_TCP_PCB_LISTEN=6
CONFIG_MEMP_NUM_TCP_SEG=22
