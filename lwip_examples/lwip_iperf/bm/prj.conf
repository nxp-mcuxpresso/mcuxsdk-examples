CONFIG_TCPIP_THREAD_PRIO=8
CONFIG_DEFAULT_RAW_RECVMBOX_SIZE=12
CONFIG_DEFAULT_UDP_RECVMBOX_SIZE=12
CONFIG_DEFAULT_TCP_RECVMBOX_SIZE=12
