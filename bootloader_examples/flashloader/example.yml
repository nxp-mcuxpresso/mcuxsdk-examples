# yaml-language-server: $schema=../../../../scripts/data_schema/example_description_schema.json
flashloader:
  section-type: application
  contents:
    meta_path: examples/bootloader_examples/flashloader
    project-root-path: boards/${board}/bootloader_examples/flashloader/${multicore_foldername}
    document:
      name: flashloader${core_id_suffix_name}
      category: bootloader_examples
      brief: The flashloader is a bootloader that executes from target RAM memory
        on the platform. The bootloader is a configurable flash programming utility
        that operates over a serial connection on MCU devices. It enables quick and
        easy programming of MCU devices through the entire product life cycle, including
        application development, final product manufacturing, and more.Host-side command
        line and GUI tools are available to communicate with the bootloader. Users
        can utilize host tools to upload and/or download application code via the
        bootloader.
