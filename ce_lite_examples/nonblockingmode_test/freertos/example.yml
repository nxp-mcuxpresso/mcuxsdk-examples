# yaml-language-server: $schema=../../../../../scripts/data_schema/example_description_schema.json
ce_lite_nonblockingmode_test_freertos:
  section-type: application
  contents:
    meta_path: examples/ce_lite_examples/nonblockingmode_test/freertos
    project-root-path: boards/${board}/ce_lite_examples/nonblockingmode_test/${multicore_foldername}/freertos
    complete_cmake_data:
