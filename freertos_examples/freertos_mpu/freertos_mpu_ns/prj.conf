CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.cm33_trustzone.non_secure=y
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.extension=y
CONFIG_MPU_SUPPORT=y

CONFIG_configKERNEL_PROVIDED_STATIC_MEMORY=n
CONFIG_configSUPPORT_STATIC_ALLOCATION=y
CONFIG_configENABLE_MPU=y
CONFIG_configENABLE_FPU=y
CONFIG_configENABLE_TRUSTZONE=y
CONFIG_configRUN_FREERTOS_SECURE_ONLY=n

CONFIG_configTICK_RATE_HZ=100
CONFIG_configUSE_TIME_SLICING=y
CONFIG_configMAX_TASK_NAME_LEN=12
CONFIG_configTOTAL_HEAP_SIZE=51200
CONFIG_configQUEUE_REGISTRY_SIZE=0
CONFIG_configUSE_STATS_FORMATTING_FUNCTIONS=y
CONFIG_configTIMER_TASK_PRIORITY="3"
CONFIG_configTIMER_QUEUE_LENGTH=5
CONFIG_configTIMER_TASK_STACK_DEPTH="(configMINIMAL_STACK_SIZE)"

CONFIG_INCLUDE_uxTaskGetStackHighWaterMark=n
CONFIG_INCLUDE_xTaskGetIdleTaskHandle=n
CONFIG_INCLUDE_xTaskGetSchedulerState=n
CONFIG_INCLUDE_xSemaphoreGetMutexHolder=n
CONFIG_INCLUDE_xTaskResumeFromISR=n
