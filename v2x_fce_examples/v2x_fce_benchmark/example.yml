# yaml-language-server: $schema=../../../../../scripts/data_schema/example_description_schema.json
v2x_fce_benchmark:
  section-type: application
  contents:
    meta_path: examples/v2x_fce_examples/v2x_fce_benchmark
    project-root-path: boards/${board}/v2x_fce_examples/v2x_fce_benchmark/${multicore_foldername}
    document:
      name: v2x_fce_benchmark${core_id_suffix_name}
      category: v2x_fce_examples
      brief: "EdgeLock V2X-FCE performance benchmark: throughput, latency, setup latency, Ops and jitter in signal and poll modes for AES-GCM, AES-CBC, HMAC-SHA-256 and HASH-SHA-256."
      example_readme:
      - examples/v2x_fce_examples/v2x_fce_benchmark/readme.md
      - ${board_root}/${board}/v2x_fce_examples/v2x_fce_benchmark/example_board_readme.md
      - ${board_root}/${board}/examples_shared_readme.md
  boards:
    imx943evk@cm33_core1: []
    imx943evk@cm7_core0: []
    imx943evk@cm7_core1: []
