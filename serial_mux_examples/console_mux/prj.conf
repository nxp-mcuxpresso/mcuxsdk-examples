CONFIG_MCUX_COMPONENT_driver.lpuart=y

# Debug console (lite). On the client cores it is bound to the muxuart HAL
# UART adapter (selected in the per-core board overlay prj.conf).
CONFIG_MCUX_COMPONENT_utility.debug_console_lite=y
CONFIG_MCUX_COMPONENT_utility.assert_lite=y

# Reusable serial-port multiplexer component (COBS core + slots + roles),
# plus the transport sub-part that supplies the hub/client bring-up glue.
CONFIG_MCUX_COMPONENT_component.serial_mux=y
# Enabling the component above auto-enables its slot IPC, hub, client,
# and transport sub-parts (each defaults to y in the serial_mux Kconfig);
# override any of them to n here only if a build does not need that role.

# Shared-memory slot payload / ring depth / cache-line size come from the
# serial_mux Kconfig defaults (MUX_SLOTS_PAYLOAD_MAX=240, MUX_SLOTS_DEPTH=4,
# MUX_SLOTS_CACHELINE=32). The number of client cores (MUX_SLOTS_CORES) is
# board-specific and lives in the imx943evk overlay prj.conf.
