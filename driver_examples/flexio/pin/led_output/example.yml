    document:
      name: flexio_pin_led_output${core_id_suffix_name}
      category: driver_examples/flexio
      brief: The FLEXIO led project is a demonstration program that uses the FELXIO
        software to manipulate the felxio-pin.The example is supported by the set,
        clear, and toggle write-only registers for each flexio output data register.
        The example take turns to shine the LED.
