flexio_i2c_read_accel_value_transfer:
  section-type: application
  contents:
    meta_path: examples/driver_examples/flexio/i2c/read_accel_value_transfer
    project-root-path: boards/${board}/driver_examples/flexio/i2c/read_accel_value_transfer/${multicore_foldername}
    document:
      name: flexio_i2c_read_accel_value_transfer${core_id_suffix_name}
      category: driver_examples/flexio
      brief: 'The flexio_i2c_read_accel_value example shows how to use FLEXIO I2C  Master
        driver to communicate with an i2c device: 1. How to use the flexio i2c master
        driver to read a i2c device who_am_I register. 2. How to use the flexio i2c
        master driver to write/read the device registers.In this example, the values
        of three-axis accelerometer print to the serial terminal on PC throughthe
        virtual serial port on board.'
      example_readme:
      - examples/driver_examples/flexio/i2c/read_accel_value_transfer/readme.md
      - ${board_root}/${board}/driver_examples/flexio/i2c/read_accel_value_transfer/example_board_readme.md
