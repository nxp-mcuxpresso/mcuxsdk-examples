    document:
      name: flexspi_nor_polling_transfer${core_id_suffix_name}
      category: driver_examples/flexspi
      brief: The flexspi_nor_polling_transfer example shows how to use flexspi driver
        with polling:In this example, flexspi will send data and operate the external
        Nor flash connected with FLEXSPI. Some simple flash command willbe executed,
        such as Write Enable, Erase sector, Program page.Example will first erase
        the sector and program a page into the flash, at last check if the data in
        flash is correct.
