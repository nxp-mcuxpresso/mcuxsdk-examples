# yaml-language-server: $schema=../../../../scripts/data_schema/example_description_schema.json
sram_emulator:
  section-type: application
  contents:
    meta_path: examples/driver_examples/sramc/sram_emulator
    project-root-path: boards/${board}/driver_examples/sramc/sram_emulator/${multicore_foldername}
    document:
      name: sram_emulator${core_id_suffix_name}
