      - ${board_root}/${board}/driver_examples/sramc/sram_emulator/example_board_readme.md
      - ${board_root}/${board}/examples_shared_readme.md
  boards:
    frdmimxrt1186@cm7:
    - -armgcc@debug
    - -armgcc@hyperram_debug
    - -armgcc@hyperram_release
    - -armgcc@release
    - -iar@debug
    - -iar@hyperram_debug
    - -iar@hyperram_release
    - -iar@release
    - -mdk@debug
    - -mdk@hyperram_debug
    - -mdk@hyperram_release
    - -mdk@release