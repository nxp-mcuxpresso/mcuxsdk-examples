lpuart_interrupt_transfer_seven_bits:
  section-type: application
  contents:
    meta_path: examples/driver_examples/lpuart/interrupt_transfer_seven_bits
    project-root-path: boards/${board}/driver_examples/lpuart/interrupt_transfer_seven_bits/${multicore_foldername}
    document:
      name: lpuart_interrupt_transfer_seven_bits${core_id_suffix_name}
      category: driver_examples/lpuart
      brief: 'The lpuart_interrupt_transfer_seven_bits Example project is to demonstrate
        usage of the KSDK lpuart driver with seven data bits feature enabled.In the
        example, you can send characters to the console back and they will be printed
        out onto console in a group of 8 characters.NOTE: Please set com port format
        to "7 data bits without parity bit" in PC''s com port tool'
