sinc_lpspi:
  section-type: application
  contents:
    meta_path: examples/driver_examples/sinc/lpspi
    project-root-path: boards/${board}/driver_examples/sinc/lpspi/${multicore_foldername}
    document:
      name: sinc_lpspi${core_id_suffix_name}
      category: driver_examples/sinc
      brief: The sinc lpspi example shows how to use SINC driver to configure SINC
        module as single conversion mode to work with on-chip lpspi.
      example_readme:
      - examples/driver_examples/sinc/lpspi/readme.md
      - ${board_root}/${board}/driver_examples/sinc/lpspi/example_board_readme.md
      - ${board_root}/${board}/examples_shared_readme.md
  boards:
    frdmmcxn947@cm33_core0: []
    frdmmcxn947t@cm33_core0: []
    mcxn9xxevk@cm33_core0: []
    imx943evk@cm7_core1:
    - +armgcc@debug
    - +armgcc@release
    - +iar@release
    - +iar@debug
    imx943evk@cm7_core0:
    - +armgcc@debug
    - +armgcc@release
    - +iar@release
    - +iar@debug
    imx943evk@cm33_core1:
    - +armgcc@debug
    - +armgcc@release
    - +iar@release
    - +iar@debug
