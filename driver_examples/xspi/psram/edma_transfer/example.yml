xspi_psram_edma_transfer:
  section-type: application
  contents:
    meta_path: examples/driver_examples/xspi/psram/edma_transfer
    project-root-path: boards/${board}/driver_examples/xspi/psram/edma_transfer/${core_id}
    document:
      name: xspi_psram_edma_transfer${core_id_suffix_name}
      category: driver_examples/xspi
      brief: The xspi_psram_edma_transfer example shows how to use xspi driver with
        edma. In this example, xspi will send data and operate the external PSRAM
        connected with XSPI. Some simple flash command will be executed, such as Read
        Data and Write Data.Example will write/read through the whole chip, through
        IP command and AHB command.
      example_readme:
      - examples/driver_examples/xspi/psram/edma_transfer/readme.md
      - ${board_root}/${board}/driver_examples/xspi/psram/edma_transfer/example_board_readme.md
      - ${board_root}/${board}/examples_shared_readme.md
  boards:
    mimxrt700evk@cm33_core0:
    - -armgcc@debug
    - -armgcc@release
    - -iar@debug
    - -iar@release
    - -mdk@debug
    - -mdk@release
    frdmimxrt700@cm33_core0:
    - -armgcc@debug
    - -armgcc@release
    - -iar@debug
    - -iar@release
    - -mdk@debug
    - -mdk@release
