---
xspi_quad_edma_transfer:
  section-type: application
  contents:
    meta_path: examples/driver_examples/xspi/quad/edma_transfer
    project-root-path: boards/${board}/driver_examples/xspi/quad/edma_transfer/${core_id}
    document:
      name: xspi_quad_edma_transfer${core_id_suffix_name}
      category: driver_examples/xspi
      brief: The xspi_quad_edma_transfer example shows how to use xspi driver with
        EDMA to access a quad SPI NOR flash. In this example, xspi will send data
        and operate the external Quad NOR flash connected with XSPI. Some simple flash
        commands will be executed, such as Write Enable, Erase sector, Program page.
        Example will first erase the sector and program a page into the flash, then
        check if the data in flash is correct.
      example_readme:
        - examples/driver_examples/xspi/quad/edma_transfer/readme.md
        - ${board_root}/${board}/driver_examples/xspi/quad/edma_transfer/example_board_readme.md
        - ${board_root}/${board}/examples_shared_readme.md
  boards:
    frdmimxrt700@cm33_core0:
      - -armgcc@debug
      - -armgcc@release
      - -iar@debug
      - -iar@release
      - -mdk@debug
      - -mdk@release
