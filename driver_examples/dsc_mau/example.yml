dsc_mau:
  section-type: application
  contents:
    meta_path: examples/driver_examples/dsc_mau
    project-root-path: boards/${board}/driver_examples/dsc_mau/${multicore_foldername}
    document:
      name: dsc_mau${core_id_suffix_name}
      category: driver_examples/dsc_mau
      brief: The dsc_mau example demonstrates the MAU (Math Acceleration Unit) driver
        by computing sine, cosine, arctangent, square root, inverse square root, and
        reciprocal using Float32, Frac32 (Q1.31), Frac16 (Q1.15), and Int32 data
        formats. Results are printed to the serial terminal.
      example_readme:
      - examples/driver_examples/dsc_mau/readme.md
      - ${board_root}/${board}/driver_examples/dsc_mau/example_board_readme.md
      - ${board_root}/${board}/examples_shared_readme.md
  boards:
