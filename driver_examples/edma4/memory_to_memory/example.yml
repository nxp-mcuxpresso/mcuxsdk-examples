    meta_path: examples/driver_examples/edma4/memory_to_memory
    project-root-path: boards/${board}/driver_examples/edma4/memory_to_memory/${multicore_foldername}
    document:
      name: edma4_memory_to_memory${core_id_suffix_name}
      category: driver_examples/edma4
      brief: The EDMA4 memory to memory example is a simple demonstration program
        that uses the SDK software.It executes one shot transfer from source buffer
        to destination buffer using the SDK EDMA4 drivers.The purpose of this example
        is to show how to use the EDMA4 and to provide a simple example for debugging
        and further development.
