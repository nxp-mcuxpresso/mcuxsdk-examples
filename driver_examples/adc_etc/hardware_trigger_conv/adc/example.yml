adc_etc_hardware_trigger_conv:
  section-type: application
  contents:
    meta_path: examples/driver_examples/adc_etc/hardware_trigger_conv/adc
    project-root-path: boards/${board}/driver_examples/adc_etc/adc_etc_hardware_trigger_conv/${multicore_foldername}/
    document:
      name: adc_etc_hardware_trigger_conv${core_id_suffix_name}
      category: driver_examples/adc_etc
      brief: The adc_etc_software_trigger_conv example shows how to use the ADC_ETC
        to generate a ADC trigger by PIT channel0 trigger.Every 1 second, PIT channel0
        would send a trigger signal to ADC_ETC, which can arbitrate and manage multiple
        external triggers,and ADC_ETC would generate ADC trigger.In this example,
        the ADC is configured with hardware trigger. Once ADC gets the trigger from
        the ADC_ETC, the conversion goes,then the ADC_ETC ISR would be executed.
      example_readme:
      - examples/driver_examples/adc_etc/hardware_trigger_conv/adc/readme.md
      - ${board_root}/${board}/driver_examples/adc_etc/adc_etc_hardware_trigger_conv/example_board_readme.md
      - ${board_root}/${board}/examples_shared_readme.md
