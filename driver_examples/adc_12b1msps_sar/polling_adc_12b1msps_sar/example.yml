adc_12b1msps_sar_polling:
  section-type: application
  contents:
    meta_path: examples/driver_examples/adc_12b1msps_sar/polling_adc_12b1msps_sar
    project-root-path: boards/${board}/driver_examples/adc/polling/${multicore_foldername}
    document:
      name: adc_12b1msps_sar_polling${core_id_suffix_name}
      category: driver_examples/adc
      brief: The adc_polling example shows the simplest way to use adc driver.In this
        example, user should indicate a channel to provide a voltage signal (can be
        controlled by user) as the adc'ssample input. When running the project, typing
        any key into debug console would trigger the conversion. The execution would
        check the conversion completed flag in loop until the flag is asserted, which
        means the conversion is completed. Then read the conversion result value and
        print it to debug console.Note, the default setting of initialization for
        the ADC converter is just an available configuration. User can changethe configuration
        structure's setting in application to fit the special requirement.The auto-calibration
        is not essential but strongly recommended. It can help to adjust the converter
        itself and improvethe adc's performance.
      example_readme:
      - examples/driver_examples/adc_12b1msps_sar/polling_adc_12b1msps_sar/readme.md
      - ${board_root}/${board}/driver_examples/adc/polling/example_board_readme.md
      - ${board_root}/${board}/examples_shared_readme.md
