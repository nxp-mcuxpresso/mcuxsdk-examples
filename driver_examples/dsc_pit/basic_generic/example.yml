pit_basic_generic:
  section-type: application
  contents:
    meta_path: examples/driver_examples/dsc_pit/basic_generic
    project-root-path: boards/${board}/driver_examples/pit/basic_generic/${multicore_foldername}
    document:
      name: pit_basic_generic${core_id_suffix_name}
      category: driver_examples
      brief: The pit_basic_generic project is a simple demonstration program of the SDK
        PIT driver (drivers/dsc_pit) using a platform-neutral ISR convention. It sets
        up the PIT hardware block to trigger a periodic interrupt after every 1 second.
        When the PIT interrupt is triggered, a message is printed on the UART terminal
        and an LED is toggled on the board.
      example_readme:
      - examples/driver_examples/dsc_pit/basic_generic/readme.md
      - ${board_root}/${board}/driver_examples/pit/basic_generic/example_board_readme.md
      - ${board_root}/${board}/examples_shared_readme.md
  boards:
