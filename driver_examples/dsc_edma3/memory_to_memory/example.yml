dsc_edma3_memory_to_memory:
  section-type: application
  contents:
    meta_path: examples/driver_examples/dsc_edma3/memory_to_memory
    project-root-path: boards/${board}/driver_examples/dsc_edma3/memory_to_memory/${multicore_foldername}
    document:
      name: dsc_edma3_memory_to_memory${core_id_suffix_name}
      category: driver_examples/dsc_edma3
      brief: The EDMA memory to memory example is a simple demonstration program that
        uses the SDK software. It executes one shot transfer from source buffer to
        destination buffer using the SDK eDMA3 drivers. The purpose of this example
        is to show how to use the eDMA3 and to provide a simple example for debugging
        and further development.
      example_readme:
      - examples/driver_examples/dsc_edma3/memory_to_memory/readme.md
      - ${board_root}/${board}/driver_examples/dsc_edma3/memory_to_memory/example_board_readme.md
      - ${board_root}/${board}/examples_shared_readme.md
