lpit_pwm:
  section-type: application
  contents:
    meta_path: examples/driver_examples/lpit/lpit_pwm
    project-root-path: boards/${board}/driver_examples/lpit/lpit_pwm/${multicore_foldername}
    document:
      name: lpit_pwm${core_id_suffix_name}
      category: driver_examples/lpit
      brief: This example show how to use SDK drivers to implement the PWM feature
        by LPIT IP module in dualperiodcounter mode.You can set up PWM singal frequency
        and duty in this example.Connect PWM singal output pin to oscilloscope, you
        will see PWM wave.
      example_readme:
      - examples/driver_examples/lpit/lpit_pwm/readme.md
      - ${board_root}/${board}/driver_examples/lpit/lpit_pwm/example_board_readme.md
      - ${board_root}/${board}/examples_shared_readme.md
