lpit_single_channel:
  section-type: application
  contents:
    meta_path: examples/driver_examples/lpit/single_channel
    project-root-path: boards/${board}/driver_examples/lpit/single_channel/${multicore_foldername}
    document:
      name: lpit_single_channel${core_id_suffix_name}
      category: driver_examples/lpit
      brief: The LPIT single channel project is a simple example of the SDK LPIT driver.
        It sets up the LPIThardware block to trigger a periodic interrupt after every
        1 second. When the LPIT interrupt is triggereda message a printed on the serial
        terminal and an LED is toggled on the board.
      example_readme:
      - examples/driver_examples/lpit/single_channel/readme.md
      - ${board_root}/${board}/driver_examples/lpit/single_channel/example_board_readme.md
      - ${board_root}/${board}/examples_shared_readme.md
