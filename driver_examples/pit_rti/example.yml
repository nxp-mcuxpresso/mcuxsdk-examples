# yaml-language-server: $schema=../../../../scripts/data_schema/example_description_schema.json
pit_rti:
  section-type: application
  contents:
    meta_path: examples/driver_examples/pit_rti
    project-root-path: boards/${board}/driver_examples/pit_rti/${multicore_foldername}
    document:
      name: pit${core_id_suffix_name}
      category: driver_examples
      brief: The PIT RTI project is a simple demonstration program of the RTI timer in
        SDK PIT driver. It sets up the RTI timer to trigger a periodic interrupt after
        every 1 second. When the PIT RTI interrupt is triggered, a message will be
        printed on the UART terminal and an LED be toggled on the board.
      example_readme:
      - examples/driver_examples/pit_rti/readme.md
      - ${board_root}/${board}/driver_examples/pit_rti/example_board_readme.md
      - ${board_root}/${board}/examples_shared_readme.md
  boards: {}
