snvs_sw_zmk:
  section-type: application
  contents:
    meta_path: examples/driver_examples/snvs_hp/snvs_sw_zmk
    project-root-path: boards/${board}/driver_examples/snvs/snvs_sw_zmk/${multicore_foldername}
    document:
      name: snvs_sw_zmk${core_id_suffix_name}
      category: driver_examples/snvs
      brief: The SNVS SW ZMK project shows how to provision the zeroizable master
        key (ZMK) by software based on SDK SNVS driver. In this example, ZMK key value
        is set and ECC is enabled. When change the ZMK key value, violation detected
        and ZMK key is zeroized.
