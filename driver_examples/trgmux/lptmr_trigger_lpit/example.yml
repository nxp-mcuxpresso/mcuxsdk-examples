# yaml-language-server: $schema=../../../../../scripts/data_schema/example_description_schema.json
trgmux_lptmr_trigger_lpit:
  section-type: application
  contents:
    meta_path: examples/driver_examples/trgmux/lptmr_trigger_lpit
    project-root-path: boards/${board}/driver_examples/trgmux/lptmr_trigger_lpit/${multicore_foldername}
    document:
      name: trgmux_lptmr_trigger_lpit${core_id_suffix_name}
      category: driver_examples/trgmux
      brief: The lptmr_trigger_lpit project is a simple example of the SDK LPIT, LPTMR
        and TRGMUX driver which shows how to use the LPTMR and TRGMUX to generate a
        LPIT trigger. It sets up the LPTMR hardware block to generate the trigger every
        0.5 second, and the LPIT counter will load on the first trigger rising edge
        and then decrement down to zero on each trigger rising edge. A message would
        be printed on the serial terminal.
      example_readme:
      - examples/driver_examples/trgmux/lptmr_trigger_lpit/readme.md
      - ${board_root}/${board}/driver_examples/trgmux/lptmr_trigger_lpit/example_board_readme.md
      - ${board_root}/${board}/examples_shared_readme.md
  boards:
    evkmcimx7ulp:
    - -armgcc@flash_debug
    - -armgcc@flash_release
    - -iar@flash_debug
    - -iar@flash_release
    frdmmcxe247: []
