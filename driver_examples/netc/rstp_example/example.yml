rstp_example:
  section-type: application
  contents:
    meta_path: examples/driver_examples/netc/rstp_example
    project-root-path: boards/${board}/driver_examples/netc/rstp_example/${multicore_foldername}
    document:
      name: rstp_example${core_id_suffix_name}
      category: driver_examples/netc
      brief: 'The example shows the way to use NETC driver with RSTP/MSTP protocol to act as a managed switch with spanning tree support. '
      example_readme:
      - examples/driver_examples/netc/rstp_example/readme.md
      - ${board_root}/${board}/driver_examples/netc/rstp_example/example_board_readme.md
      - ${board_root}/${board}/examples_shared_readme.md
  boards:
    imx943evk@cm7_core1:
    - +armgcc@debug
    - +armgcc@release
    - +iar@release
    - +iar@debug
    imx943evk@cm7_core0:
    - +armgcc@debug
    - +armgcc@release
    - +iar@release
    - +iar@debug
    imx943evk@cm33_core1:
    - +armgcc@debug
    - +armgcc@release
    - +iar@release
    - +iar@debug
