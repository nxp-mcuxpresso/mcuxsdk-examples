# yaml-language-server: $schema=../../../../../scripts/data_schema/example_description_schema.json
qtmr_timer:
  section-type: application
  contents:
    meta_path: examples/driver_examples/qtmr_1/timer
    project-root-path: boards/${board}/driver_examples/qtmr/timer/${multicore_foldername}
    document:
      name: qtmr_timer${core_id_suffix_name}
      category: driver_examples/qtmr
      brief: The QTMR project is a simple demonstration program of the SDK QTMR driver
        to use QTMR as a timer.The quad-timer module provides four timer channels
        with a variety of controls affecting both individualand multi-channel features.
        It sets up the QTMR hardware block to trigger an interrupt every 50 millisecond.When
        chaining the first channel and the second channel, Timer interrupt occur every
        10 second.When the QTMR interrupt is triggered a message a printed on the
        UART terminal.
      example_readme:
      - examples/driver_examples/qtmr_1/timer/readme.md
      - ${board_root}/${board}/driver_examples/qtmr/timer/example_board_readme.md
      - ${board_root}/${board}/examples_shared_readme.md
