lpspi_3wire_int_transfer_master:
  section-type: application
  contents:
    meta_path: examples/driver_examples/lpspi/3wire_transfer/int_transfer/master
    project-root-path: boards/${board}/driver_examples/lpspi/3wire_transfer/int_transfer/master/${multicore_foldername}
    document:
      name: lpspi_3wire_int_transfer_master${core_id_suffix_name}
      category: driver_examples/lpspi
      brief: The lpspi_3wire_int_transfer example shows how to use LPSPI's 3-wire
        mode in interrupt way:In this example , we need two boards, one board used
        as LPSPI master and another board used as LPSPI slave.The file 'lpspi_3wire_int_b2b_transfer_master.c'
        includes the LPSPI master code.This example uses the transactional API in
        LPSPI driver.1. LPSPI master send/received data to/from LPSPI slave in interrupt
        . (LPSPI Slave using interrupt to receive/send the data)2. LPSPI master will
        use SOUT pin as input/output pin, and slave will use SIN pin as input/output
        pin.
      example_readme:
      - examples/driver_examples/lpspi/3wire_transfer/int_transfer/master/readme.md
      - ${board_root}/${board}/driver_examples/lpspi/3wire_transfer/int_transfer/master/example_board_readme.md
      - ${board_root}/${board}/examples_shared_readme.md
