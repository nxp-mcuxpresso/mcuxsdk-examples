lpspi_interrupt:
  section-type: application
  contents:
    meta_path: examples/driver_examples/lpspi/interrupt
    project-root-path: boards/${board}/driver_examples/lpspi/interrupt/${multicore_foldername}
    document:
      name: lpspi_interrupt${core_id_suffix_name}
      category: driver_examples/lpspi
      brief: The lpspi_functional_interrupt example shows how to use LPSPI driver
        in interrupt way:In this example , one lpspi instance used as LPSPI master
        and another lpspi instance used as LPSPI slave .1. LPSPI master send/received
        data to/from LPSPI slave in interrupt . (LPSPI Slave using interrupt to receive/send
        the data)
