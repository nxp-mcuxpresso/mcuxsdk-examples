mdk:
  shared-workspace: erpc_matrix_multiply_rpmsg_rtos
  sharing-workspace:
  - ../../erpc_matrix_multiply_rpmsg_rtos_secondary_core/mdk/erpc_matrix_multiply_rpmsg_rtos_secondary_core_${SB_CONFIG_secondary_core_id}

iar:
  shared-workspace: erpc_matrix_multiply_rpmsg_rtos
  sharing-workspace:
  - ../../erpc_matrix_multiply_rpmsg_rtos_secondary_core/iar/erpc_matrix_multiply_rpmsg_rtos_secondary_core_${SB_CONFIG_secondary_core_id}
  config:
    __common__:
      asym-multicore-debugger:
        enable: true
        slave-workspace: "../../erpc_matrix_multiply_rpmsg_rtos_secondary_core/iar/erpc_matrix_multiply_rpmsg_rtos_secondary_core_${SB_CONFIG_secondary_core_id}.eww"
        slave-project: erpc_matrix_multiply_rpmsg_rtos_secondary_core_${SB_CONFIG_secondary_core_id}
    debug:
      asym-multicore-debugger:
        slave-configuration: debug
    release:
      asym-multicore-debugger:
        slave-configuration: release
    flash_debug:
      asym-multicore-debugger:
        slave-configuration: debug
    flash_release:
      asym-multicore-debugger:
        slave-configuration: release
    flexspi_nor_debug:
      asym-multicore-debugger:
        slave-configuration: debug
    flexspi_nor_release:
      asym-multicore-debugger:
        slave-configuration: release
