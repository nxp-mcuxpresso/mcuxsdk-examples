mdk:
  shared-workspace: rpmsg_lite_pingpong_tzm
  sharing-workspace:
  - ../../rpmsg_lite_pingpong_tzm_secondary_core/mdk/rpmsg_lite_pingpong_tzm_secondary_core_${SB_CONFIG_secondary_core_id}

iar:
  shared-workspace: rpmsg_lite_pingpong_tzm
  sharing-workspace:
  - ../../rpmsg_lite_pingpong_tzm_secondary_core/iar/rpmsg_lite_pingpong_tzm_secondary_core_${SB_CONFIG_secondary_core_id}
  config:
    __common__:
      asym-multicore-debugger:
        enable: true
        slave-workspace: "../../rpmsg_lite_pingpong_tzm_secondary_core/iar/rpmsg_lite_pingpong_tzm_secondary_core_${SB_CONFIG_secondary_core_id}.eww"
        slave-project: rpmsg_lite_pingpong_tzm_secondary_core_${SB_CONFIG_secondary_core_id}
    debug:
      asym-multicore-debugger:
        slave-configuration: debug
    release:
      asym-multicore-debugger:
        slave-configuration: release
    flash_debug:
      asym-multicore-debugger:
        slave-configuration: debug
    flash_release:
      asym-multicore-debugger:
        slave-configuration: release
    flexspi_nor_debug:
      asym-multicore-debugger:
        slave-configuration: debug
    flexspi_nor_release:
      asym-multicore-debugger:
        slave-configuration: release
