loc_reader_freertos:
  section-type: application
  contents:
    meta_path: examples/wireless_examples/bluetooth/loc_reader/freertos
    project-root-path: boards/${board}/wireless_examples/bluetooth/loc_reader/freertos/${multicore_foldername}
    document:
      name: loc_reader_freertos
      category: wireless_examples/bluetooth/loc_reader/freertos
      brief: The BLE Localization Reader application is a simple demonstration program based
        on the MCUXpresso SDK. The application implements a BLE peripheral device that
        performs distance measurement using Channel Sounding.
  boards:
    kw47evk@cm33_core0: []
    kw47loc@cm33_core0: []
    mcxw72evk@cm33_core0: []
    frdmmcxw72@cm33_core0: []
    mcxw72loc@cm33_core0: []
    frdmkw43: []
    kw43loc: []
    frdmmcxw70:
    - -armgcc@debug
    - -armgcc@release

loc_reader_freertos@rade1:
  section-type: custom_application
  contents:
    meta_path: examples/wireless_examples/bluetooth/loc_reader/freertos
    document:
      extra_build_args:
      - -DCONF_FILE=examples/wireless_examples/bluetooth/config/channel_sounding_rade1.conf
