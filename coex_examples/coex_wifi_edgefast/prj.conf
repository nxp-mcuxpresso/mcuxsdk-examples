CONFIG_MCUX_COMPONENT_component.psa_crypto_driver.mbedtls_thread_alt=y
CONFIG_MCUX_COMPONENT_component.wifi_bt_module.config=y
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel=y
CONFIG_MCUX_COMPONENT_middleware.lwip=y
CONFIG_MCUX_COMPONENT_middleware.lwip.apps.lwiperf=y
CONFIG_MCUX_COMPONENT_middleware.mbedtls3x=y
CONFIG_MCUX_COMPONENT_middleware.mbedtls3x.port.config=y

CONFIG_FSL_OSA_ALLOCATED_HEAP=n

# FreeRTOS config
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.extension=y

# Wi-Fi config
