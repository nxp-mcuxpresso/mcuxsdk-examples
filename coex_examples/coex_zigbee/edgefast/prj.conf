#edgefast config
CONFIG_MCUX_COMPONENT_component.messaging=y
CONFIG_MCUX_COMPONENT_component.software_rng_adapter=y
CONFIG_MCUX_COMPONENT_component.usart_adapter=y
CONFIG_MCUX_COMPONENT_driver.flash_config=y
CONFIG_MCUX_COMPONENT_driver.flexcomm_i2c=y
CONFIG_MCUX_COMPONENT_driver.io_mux=y
CONFIG_MCUX_COMPONENT_middleware.edgefast_bluetooth.ble.ethermind=y
CONFIG_MCUX_COMPONENT_middleware.edgefast_bluetooth.shell_ble=y

CONFIG_MCUX_COMPONENT_middleware.edgefast_bluetooth.pal=y
CONFIG_MCUX_COMPONENT_middleware.edgefast_bluetooth.profile.bas=y
CONFIG_MCUX_COMPONENT_middleware.edgefast_bluetooth.profile.hrs=y
CONFIG_MCUX_COMPONENT_utility.assert_lite=n
CONFIG_MCUX_COMPONENT_utility.debug_console_lite=n
CONFIG_MCUX_PRJSEG_module.board.pinmux_customize_folder=y
CONFIG_MCUX_PRJSEG_project.hw_app_customize_folder=y

#app_bluetooth_config
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_GATT_CACHING=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_GATT_SERVICE_CHANGED=y
CONFIG_BT_HOST_CRYPTO=y
CONFIG_BT_ID_MAX=4
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_L2CAP_IFRAME_SUPPORT=y
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_MAX_PAIRED=16
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_PHY_UPDATE=y
CONFIG_BT_PRIVACY=y
CONFIG_BT_RF_TEST_MODE=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_SIGNING=y
CONFIG_BT_SMP=y
# Disable BT_SNOOP to avoid Multiple Definitions error of `USB_HostMsdEvent` and `USB_HostMsdTask` with wifi_nxp component
CONFIG_BT_SNOOP=n
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_WHITELIST=y

CONFIG_CONTROLLER_ID="kUSB_ControllerEhci0"
CONFIG_DEBUG_CONSOLE_RX_ENABLE=n
CONFIG_USB_HOST_CONFIG_MSD=1
CONFIG_USB_HOST_CONFIG_EHCI=1