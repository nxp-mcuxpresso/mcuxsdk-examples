# yaml-language-server: $schema=../../../../../scripts/data_schema/example_description_schema.json
mmccard_freertos:
  section-type: application
  contents:
    meta_path: examples/sdmmc_examples/mmccard_freertos
    project-root-path: boards/${board}/sdmmc_examples/mmccard_freertos/${multicore_foldername}
    document:
      name: mmccard_freertos${core_id_suffix_name}
      category: sdmmc_examples/mmccard_freertos
      brief: The MMCCARD FreeRTOS project is a demonstration program that uses the
        SDK software. It reads/writes/erases the MMC card continusly. The purpose
        of this example is to show how to use MMCCARD driverwith FreeRTOS in SDK software
        to access MMC card.Note:User can use MMC plus card or emmc(on board IC, but
        not recommand use emmc socket,due to high speed timing restriction)
      example_readme:
      - examples/sdmmc_examples/mmccard_freertos/readme.md
      - ${board_root}/${board}/sdmmc_examples/mmccard_freertos/example_board_readme.md
      - ${board_root}/${board}/examples_shared_readme.md
  boards:
    evkmimxrt595@cm33: []
    mimxrt700evk@cm33_core0: []
